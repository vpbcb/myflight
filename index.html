<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>MyFlight:All in one</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <style>
        /* Базовые переменные (Светлая тема по умолчанию и принудительно) */
        :root, body.light-theme {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --input-bg: #f7f9fa;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #1976d2; /* Синий цвет из myshift */
            --border-color: rgba(0, 0, 0, 0.1);
        }

        /* Темная тема (включается ОС автоматически, если нет класса .light-theme) */
        @media (prefers-color-scheme: dark) {
            :root:not(.light-theme) {
                --bg-color: #0b0f19;
                --card-bg: #161e2e;
                --input-bg: rgba(0, 0, 0, 0.2);
                --text-main: #cbd5e1;
                --text-secondary: #64748b;
                --accent-color: #0273ad; /* Темно-синий цвет из myshift */
                --border-color: rgba(255, 255, 255, 0.1);
            }
        }

        /* Принудительная темная тема (при клике на кнопку) */
        html.dark-theme {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --input-bg: rgba(0, 0, 0, 0.2);
            --text-main: #cbd5e1;
            --text-secondary: #64748b;
            --accent-color: #0273ad; /* Темно-синий цвет из myshift */
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* === ВАЖНО: Базовые стили документа === */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Стили кнопки переключения темы */
        .theme-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: transparent;
            border: none;
            padding: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--text-main); /* <-- Вернули плотный цвет */
            z-index: 100;
            transition: opacity 0.2s;
        }
        .theme-toggle:active { opacity: 0.5; }

        /* === СТИЛИ REFRESH === */
        .refresh-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: transparent;
            border: none;
            padding: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--text-main); /* <-- Вернули плотный цвет */
            z-index: 100;
            transition: opacity 0.2s, transform 0.2s;
            user-select: none;
        }
        /* Невидимая зона для легкого нажатия пальцем */
        .refresh-btn::after {
            content: ''; position: absolute; top: -15px; bottom: -15px; left: -15px; right: -15px;
        }
        .refresh-btn:active { transform: scale(0.9); opacity: 0.5; }

        /* Главный контейнер */
        .app-shell {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            position: relative; /* Гарантирует, что надпись кэша и кнопка не вылетят за пределы */
        }

        .header {
            width: 100%;
            padding: 20px 20px 20px;
            display: flex;
            justify-content: center; /* Строго по центру */
            box-sizing: border-box;
        }

        .header .main-logo {
            height: 60px; /* Настрой высоту логотипа под себя, если он будет слишком мелким или крупным */
            width: auto;
            max-width: 100%; /* Защита, чтобы логотип не вылез за края на узких экранах */
            display: block;
           transition: filter 0.3s ease; /* Плавная смена цвета */
        }

        /* Делаем логотип белым при системной темной теме */
        @media (prefers-color-scheme: dark) {
            :root:not(.light-theme) .main-logo {
                filter: brightness(0) invert(1);
            }
        }

        /* Делаем логотип белым при включении темной темы кнопкой */
        html.dark-theme .main-logo {
            filter: brightness(0) invert(1);
        }

        .container {
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 колонки */
            gap: 12px;
            margin-top: auto;
            margin-bottom: 100px; /* Отступ снизу, чтобы сетка не наезжала на кнопки */
        }

        .project-card {
            background: var(--input-bg);
            border-radius: 16px;
            padding: 16px 8px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
            border: 1px solid var(--border-color);
            aspect-ratio: 1 / 1;
        }

        .project-card:active {
            transform: scale(0.97);
            opacity: 0.7;
        }
        
        .icon-box {
            width: 42px;
            height: 42px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 32px;
        }

        .info {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .title {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* --- НАДПИСЬ С ИМЕНЕМ КЭША --- */
        .cache-label {
            text-align: center;
            font-size: 0.5rem;
            color: var(--text-secondary);
            opacity: 0.4;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            white-space: nowrap;
            margin-top: -10px; /* Прижимаем ближе к логотипу */
            margin-bottom: 20px; /* Отступ до карточки поиска */
            z-index: 50;
            pointer-events: none;
        }
/* --- СТИЛИ БЛОКА ПОИСКА РЕЙСА И БОРТА --- */
        .flight-search-card {
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .search-wrapper {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 48px;
        }
        .input-group {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            height: 48px;
            width: 115px; /* Еще более узкое поле */
            flex-shrink: 0; 
        }
        .prefix {
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 0;
            width: 55px; 
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .su-color { background: var(--accent-color); }
        .ac-color { background: var(--accent-color); font-size: 1.1rem; }
        
        .short-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0 5px; /* Уменьшили внутренний отступ для узкого поля */
            outline: none;
            width: 100%;
            text-align: center;
        }
        .short-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .inline-result {
            flex: 1;
            display: flex; 
            align-items: center;
            height: 100%;
            position: relative; 
            padding-right: 30px; 
            min-width: 0; /* Обязательно для корректных замеров скриптом внутри flex */
        }
        .result-route {
            font-size: 1.1rem; /* Оптимальный размер */
            font-weight: 800; 
            color: var(--accent-color); /* Фирменный синий цвет */
            line-height: 1.2; 
            white-space: nowrap; /* Жестко запрещаем тексту падать на новую строку */
            overflow: hidden; 
            text-overflow: ellipsis; /* Многоточие на случай, если текст не успел сжаться */
            display: block; 
            width: 100%;
            letter-spacing: -0.3px; 
        }
        .result-ac {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-color);
        }
        .result-error {
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* --- Стили содержимого окна Aircraft Info --- */
        #infoModalContent div > span:first-child { color: var(--text-secondary); }
        #infoFormerReg, #infoSeatConf, #infoMinOAT { color: var(--text-main); }
        #infoKzApproval { font-size: 18px !important; text-transform: uppercase; }

        /* --- СТИЛИ МОДАЛЬНОГО ОКНА ДЛЯ БОРТОВ (Как в MyFuel) --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 2000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background-color: var(--card-bg); padding: 20px; border-radius: 15px; width: 85%; max-width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center; position: relative; font-size: 14px; line-height: 1.5; color: var(--text-main); border: 1px solid var(--border-color); }
        .modal-close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; font-weight: bold; color: var(--text-secondary); cursor: pointer; border: none; background: none; }
        .modal-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; display: block; color: var(--accent-color); }
        .ambiguity-list { text-align: left; margin-top: 10px; }
        .ambiguity-item { padding: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--accent-color); font-weight: bold; font-size: 15px; }
        .ambiguity-item:last-child { border-bottom: none; }
        html.dark-theme .ambiguity-item:hover { background-color: rgba(255, 255, 255, 0.05); }

    </style>
    <!-- Микро-скрипт защиты от белой вспышки (как на подстраницах) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('hub_theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.add('light-theme');
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark-theme');
            }
        })();
    </script>
</head>
<body>

        <div class="header">
            <img src="./myflightlogo.png" alt="My Flight" class="main-logo">
        </div>
        
        <!-- Надпись кэша под логотипом -->
        <div class="cache-label" id="cacheLabel">cache: checking...</div>

<!-- Место под вывод информации о самолете -->

    <!-- Скрипт логики -->
    <script>
        // Константы SVG иконок
        const themeIconLight = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
        const themeIconDark = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

        // Функция смены темы
        function toggleTheme() {
            const html = document.documentElement;
            let isDark;
            
            if (html.classList.contains('dark-theme')) {
                html.classList.remove('dark-theme');
                html.classList.add('light-theme');
                isDark = false;
            } else if (html.classList.contains('light-theme')) {
                html.classList.remove('light-theme');
                html.classList.add('dark-theme');
                isDark = true;
            } else {
                const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (sysDark) {
                    html.classList.add('light-theme');
                    isDark = false;
                } else {
                    html.classList.add('dark-theme');
                    isDark = true;
                }
            }

            localStorage.setItem('hub_theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        // Обновление иконки и текста
        function updateThemeUI(isDark) {
            document.getElementById('themeIcon').innerHTML = isDark ? themeIconDark : themeIconLight;
            document.getElementById('themeText').innerText = isDark ? 'Dark mode' : 'Light mode';
        }

        // 1. Анти-Captive Portal Пинг
        async function checkRealInternet() {
            if (!navigator.onLine) return false;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000); 
                const res = await fetch('./manifest.json?ping=' + Date.now(), { 
                    method: 'GET', cache: 'no-store', signal: controller.signal 
                });
                clearTimeout(timeoutId);
                const contentType = res.headers.get("content-type");
                return res.ok && contentType && contentType.includes("application/json");
            } catch (e) {
                return false; 
            }
        }

        // 2. Ядерный сброс (Хард Ресет)
        async function hardResetApp() {
            const hasInternet = await checkRealInternet();
            if (!hasInternet) {
                alert("СБРОС ОТКЛОНЕН: Нет стабильного интернета или активен Captive Portal.\n\nПриложение защищено от саморазрушения в оффлайн-режиме.");
                return; 
            }

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Двойная жесткая вибрация
            
            // Чистим память полностью
            localStorage.clear();
            sessionStorage.clear();

            try {
                // Дожидаемся удаления всех service worker'ов
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(r => r.unregister()));
                }

                // Дожидаемся удаления всех хранилищ кэша
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }
            } catch (e) {
                console.error("Ошибка при очистке кэша:", e);
            }

            // Жесткая перезагрузка с параметром-антикэшем
            window.location.href = window.location.pathname + '?reset=' + new Date().getTime();
        }

        // Слушатель загрузки страницы
        window.addEventListener('load', () => {
            // 1. Восстановление UI темы (Сама тема уже мгновенно применена в <head>)
            const savedTheme = localStorage.getItem('hub_theme');
            if (savedTheme === 'dark') {
                updateThemeUI(true);
            } else if (savedTheme === 'light') {
                updateThemeUI(false);
            } else {
                const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                updateThemeUI(sysDark);
            }

            // 2. Логика проверки кэша
            const label = document.getElementById('cacheLabel');
            const savedVersion = localStorage.getItem('hubVersion');
            
            if (savedVersion && !navigator.onLine) {
                label.textContent = `cache: ${savedVersion}`;
                return;
            }

            fetch('./sw.js?_=' + Date.now(), { cache: 'no-store' })
                .then(response => response.text())
                .then(text => {
                    const match = text.match(/CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
                    if (match && match[1]) {
                        localStorage.setItem('hubVersion', match[1]);
                        label.textContent = `cache: ${match[1]}`;
                    } else {
                        label.textContent = savedVersion ? `cache: ${savedVersion}` : `cache: unknown`;
                    }
                })
                .catch(() => {
                    label.textContent = savedVersion ? `cache: ${savedVersion}` : `cache: unknown`;
                });

            // 3. ЛОГИКА ДОЛГОГО ТАПА НА REFRESH
            const refBtn = document.getElementById('refreshBtn');
            let refPressTimer;
            
            if (refBtn) {
                refBtn.addEventListener('contextmenu', e => e.preventDefault());
                refBtn.addEventListener('click', e => e.preventDefault()); 

                const startRefPress = (e) => {
                    if (e.type === 'touchstart') e.preventDefault();
                    refPressTimer = setTimeout(() => {
                        hardResetApp(); 
                    }, 1000); 
                };

                const cancelRefPress = () => {
                    clearTimeout(refPressTimer); 
                };

                refBtn.addEventListener('mousedown', startRefPress);
                refBtn.addEventListener('touchstart', startRefPress, {passive: false});
                refBtn.addEventListener('mouseup', cancelRefPress);
                refBtn.addEventListener('mouseleave', cancelRefPress);
                refBtn.addEventListener('touchend', cancelRefPress);
                refBtn.addEventListener('touchcancel', cancelRefPress);
            }
        });
    </script>

// --- Умная функция автоподгона размера текста ---
function autoFitText(element, baseSize = '') {
    element.style.fontSize = baseSize; // Фиксируем базовый размер
    
    requestAnimationFrame(() => {
        if (element.scrollWidth > element.clientWidth && element.clientWidth > 0) {
            const currentFontSize = parseFloat(window.getComputedStyle(element).fontSize);
            // Коэффициент 0.95 дает запас, чтобы многоточие 100% исчезло
            const ratio = (element.clientWidth / element.scrollWidth) * 0.95;
            const newFontSize = currentFontSize * ratio;
            element.style.fontSize = Math.max(newFontSize, 9) + 'px'; 
        }
    });
}

// Мгновенный оффлайн-поиск маршрута
function searchLocalRoute(inputElem) {
    inputElem.value = inputElem.value.replace(/[^0-9]/g, '');
    const num = inputElem.value.trim();
    const resRoute = document.getElementById('resRoute');

    // Сохраняем введенный номер
    localStorage.setItem('last_flight_num', num);

    if (num.length === 0) {
        resRoute.innerHTML = "поиск маршрута по номеру рейса";
        resRoute.style.color = "var(--text-secondary)";
        resRoute.style.fontWeight = "600";
        resRoute.style.textAlign = "center";
        autoFitText(resRoute, '0.7rem'); 
        return;
    }

    resRoute.style.fontWeight = "";
    resRoute.style.textAlign = "center"; // Центрируем результат

    if (typeof suflights !== 'undefined') {
        const found = suflights.find(item => item.flight === num || item.flight === `SU${num}`);
        if (found) {
            const routeWithFlags = found.route.split(' ➔ ').map(code => {
                return iataFlags[code] ? `${iataFlags[code]} ${code}` : code;
            }).join(' ➔ ');
            resRoute.innerHTML = routeWithFlags; 
            resRoute.style.color = "var(--accent-color)"; 
            autoFitText(resRoute, ''); 
        } else {
            resRoute.innerHTML = "Маршрут не найден";
            resRoute.style.color = "#ef4444";
            resRoute.style.fontWeight = "600";
            autoFitText(resRoute, '0.85rem');
        }
    } else {
        resRoute.innerHTML = "⚠️ БД не подключена";
        resRoute.style.color = "#ef4444";
        resRoute.style.fontWeight = "600";
        autoFitText(resRoute, '0.85rem');
    }
}

// Умный фокус: запоминаем значение и очищаем поле
function handleFocus(el) {
    el.dataset.prevVal = el.value;
    el.value = '';
    el.dispatchEvent(new Event('input'));
}

function handleBlur(el) {
    if (el.value.trim() === '') {
        el.value = el.dataset.prevVal || '';
        el.dispatchEvent(new Event('input'));
    }
}

// --- ЛОГИКА ОКНА УТОЧНЕНИЯ ---
let ambiguityTimeout;
function closeAmbiguity() {
    const modal = document.getElementById('ambiguityModal');
    if (!modal) return;
    modal.classList.remove('show');
    clearTimeout(ambiguityTimeout);
    ambiguityTimeout = setTimeout(() => { modal.style.display = 'none'; }, 300);
}

function showAmbiguity(matches, query) {
    const modal = document.getElementById('ambiguityModal');
    const list = document.getElementById('ambiguityList');
    list.innerHTML = '';
    matches.forEach(ac => {
        const div = document.createElement('div');
        div.className = 'ambiguity-item';
        div.textContent = `${ac.nameDisplay || ac.name} (${ac.type} ${ac.regFull})`;
        div.onclick = () => { applyAcResult(ac, query); closeAmbiguity(); };
        list.appendChild(div);
    });
    clearTimeout(ambiguityTimeout);
    modal.style.display = 'flex';
    setTimeout(() => { modal.classList.add('show'); }, 10);
}

// Форматирование и вывод результата
function applyAcResult(ac, query) {
    currentAircraft = ac;
    const resAc = document.getElementById('resAc');
    const infoBtn = document.getElementById('infoBtnContainer');
    
    if (infoBtn) infoBtn.style.display = "block";

    resAc.style.fontWeight = "";

    const cleanReg = ac.regFull ? ac.regFull.replace('-', '') : (ac.reg || "");
    
    // Двухстрочный вывод: Тип + Рег (верх), Имя (низ)

// Умный поиск борта 
function searchLocalAc(inputElem) {
    localStorage.setItem('last_ac_query', inputElem.value);
    const query = inputElem.value.toLowerCase().trim();
    const resAc = document.getElementById('resAc');
    const infoBtn = document.getElementById('infoBtnContainer');
    const modal = document.getElementById('ambiguityModal');

    const resetToPlaceholder = () => {
        resAc.innerHTML = "поиск ВС по номеру или имени";
        resAc.style.color = "var(--text-secondary)";
        resAc.style.fontWeight = "600";
        resAc.style.textAlign = "center";
        autoFitText(resAc, '0.7rem'); // Опираемся на размер из HTML
        if (infoBtn) infoBtn.style.display = "none";
        if (modal && modal.classList.contains('show')) closeAmbiguity();
    };

    if (query.length < 2) {
        resetToPlaceholder();
        return;
    }

    resAc.style.fontWeight = "";
    resAc.style.textAlign = "";

    let searchTerms = [query];
    if ('retro'.startsWith(query)) searchTerms.push('ретро');
    if ('скайтим'.startsWith(query)) searchTerms.push('skyteam');

    if (typeof aircraftDB !== 'undefined') {
        const matches = aircraftDB.filter(ac => {
            return searchTerms.some(term => {
                if ((ac.reg || "").includes(term)) return true;
                if ((ac.regFull || "").toLowerCase().includes(term)) return true;
                if ((ac.name || "").toLowerCase().includes(term)) return true;
                if ((ac.nameDisplay || "").toLowerCase().includes(term)) return true;
                return false;
            });
        });

        if (matches.length === 1) {
            applyAcResult(matches[0], query);
            if (modal && modal.classList.contains('show')) closeAmbiguity();
        } else if (matches.length > 1) {
            const uniqueBaseNames = new Set(matches.map(ac => (ac.name || "").split('(')[0].trim().toLowerCase()));
            const isVishnevsky = matches.every(ac => (ac.name || "").toLowerCase().includes("вишневск")) && query.includes("виш");
            
            if (uniqueBaseNames.size === 1 || isVishnevsky) {
                showAmbiguity(matches, query);
            } else {
                resetToPlaceholder();
            }
        } else {
            if (infoBtn) infoBtn.style.display = "none";
            resAc.innerHTML = "Борт не найден";
            resAc.style.color = "#ef4444";
            resAc.style.fontWeight = "600";
            resAc.style.textAlign = "center";
            autoFitText(resAc, '0.85rem');
            if (modal && modal.classList.contains('show')) closeAmbiguity();
        }
    } else {
        if (infoBtn) infoBtn.style.display = "none";
        resAc.innerHTML = "⚠️ БД не найдена";
        resAc.style.color = "#ef4444";
        resAc.style.fontWeight = "600";
        resAc.style.textAlign = "center";
        autoFitText(resAc, '0.85rem');
    }
}
