<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <title>RWY Wind Limits</title>
    <link rel="icon" type="image/png" sizes="192x192" href="windappicon.png">
    <link rel="apple-touch-icon" href="windapple-icon.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="format-detection" content="date=no">
    <meta name="format-detection" content="address=no">
    <meta name="format-detection" content="email=no">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f1f5f9">
    
    
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --accent: #0ea5e9;
            --status-bg: #0ea5e9; /* Цвет плашки для светлой темы */
            --table-border: rgba(0, 0, 0, 0.3); /* Цвет обводки таблицы */
            --text: #1e293b;
            --dim: #64748b;
            --border: rgba(0, 0, 0, 0.1);
            --input-bg: #f7f9fa;
            --row-bg: #ffffff; 
            --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            --rwy-asphalt: #6b7280;
            --rwy-line: #ffffff;
            --limit-kt: #7f1d1d;
            --limit-mps:#1e40af ;
            --zebra-bg: #f0f1f2; 
            --app-height: 100vh;
            --app-width: 100vw;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);

        }

        
        /* --- НОЧНАЯ ТЕМА --- */
        html.dark-theme {
            --bg: #0b0f19;
            --card: rgba(22, 30, 46, 0.98); 
            --accent: #0273ad; 
            --status-bg: #016091; 
            --table-border: #57677d; 
            --text: #cbd5e1; 
            --dim: #96a4b3;  
            --border: rgba(255, 255, 255, 0.3);  /* Взяли ваш новый бордер (0.1 вместо 0.3) */
            --input-bg: rgba(0, 0, 0, 0.09);     /* Взяли ваш новый фон под таблицу */
            --row-bg: transparent;               /* Оставляем прозрачным, чтобы работал input-bg */
            --shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.04); /* Ваш новый shadow */
            --rwy-asphalt: #475569; 
            --rwy-line: #cbd5e1; 
            --limit-kt: #c70606; 
            --limit-mps: #047fbf; 
            --zebra-bg: rgba(255, 255, 255, 0.07); 
        }

        /* Убираем краевые границы контейнера, чтобы они не бликовали в темноте */
        html.dark-theme .calculator { border-top: none; border-bottom: none; }


        /* --- НОЧНАЯ ТЕМА ТАБОВ--- */


        /* --- ТОЛЬКО ФОН ВЫКЛЮЧЕННЫХ КНОПОК В ТЕМНОЙ ТЕМЕ --- */
        html.dark-theme .action-btn:not(.active-op),
        html.dark-theme .special-btn:not(.active) {
            background: rgba(0, 0, 0, 0.2); /* Меняйте цвет или прозрачность здесь */
        }
        /* --- ЦВЕТ АКТИВНОЙ КНОПКИ НИЖНЕГО РЯДА (ОЧИЩЕНО) --- */
        html.dark-theme .tabs-row.lower .tab-btn.active,
        html.dark-theme .tabs-row.lower button.tab-btn.active {
            background: var(--status-bg) !important; /* Строгий синий цвет, как у плашки LAND */
            color: var(--text) !important;           /* Более серый/приглушенный текст вместо ослепительно белого */
            border: none !important;                 /* Убираем любые неоновые рамки */
            box-shadow: none !important;             /* Убираем свечение */
        }

        /* --- ФОН БЛОКА НИЖНИХ ВКЛАДОК В ТЕМНОЙ ТЕМЕ --- */
        html.dark-theme .tabs-content-area {
            background: rgba(0, 0, 0, 0.15); 
        }

        /* --- ЦВЕТ НЕАКТИВНЫХ КНОПОК НИЖНЕГО РЯДА (6, 5, 4, 3...) --- */
        html.dark-theme .tabs-row.lower .tab-btn:not(.active) {
            background: #121824 !important; 
            color: #bed0e8 !important;              
            border: 1px solid rgba(255, 255, 255, 0.25) !important; 
        }

        /* Жесткие переопределения для элементов без переменных */
        html.dark-theme #tableBody .t-row.beam-row { background-color: rgba(56, 189, 248, 0.15) !important; } /* Ночной бледно-голубой фон */
        /* Вкладки в тёмной теме: текст совпадает с кнопками первого ряда (#cbd5e1) */
        html.dark-theme .tab-btn { 
            background: #262e3d; 
            border-color: var(--border); 
            color: var(--text) !important; /* Тот же цвет, что в AC TYPE и RWY */
        }
        html.dark-theme .tab-btn.active { 
            background: #121824; 
            color: var(--text) !important; 
            border-bottom: 1px solid #121824 !important; 
            border-top: 3px solid var(--accent); 
        }
        /* Убран дублирующий border-bottom для нижнего ряда (кнопка должна быть плоской) */

        * {
            -webkit-tap-highlight-color: transparent;
            
            /* === АБСОЛЮТНЫЙ БЛОК ВЫДЕЛЕНИЯ И СИСТЕМНЫХ МЕНЮ === */
            -webkit-touch-callout: none; /* Убивает всплывающее меню (лупу/копирование) на iOS */
            -webkit-user-select: none;   /* Safari */
            -moz-user-select: none;      /* Firefox */
            -ms-user-select: none;       /* Старые Edge/IE */
            user-select: none;           /* Стандартный синтаксис */
            /* ================================================= */
            
            outline: none;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        /* Жесткий сброс системных стилей Apple для кнопок и полей ввода */
        button, input {
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
        }

        html {
            background-color: var(--bg);
            height: var(--app-height);
            min-height: var(--app-height);
            max-height: var(--app-height);
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: var(--text);
            display: flex;
            justify-content: center;
            margin: 0; padding: 0;
            height: var(--app-height); 
            min-height: var(--app-height);
            max-height: var(--app-height);
            overflow: hidden;
            overscroll-behavior-y: none;
        }

        .calculator {
            background: var(--card);
            border: 1px solid var(--border);
            padding: max(2px, calc(var(--safe-top) + 2px)) 20px max(65px, calc(var(--safe-bottom) + 60px)) 20px; /* Чуть увеличили отступ снизу для комфорта */
            border-radius: 0; /* Убираем скругления, чтобы на мобилках было строго от края до края */
            width: min(100vw, 440px);
            width: min(var(--app-width), 440px);
            max-width: 100%;
            min-width: 0;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: var(--app-height);
            min-height: var(--app-height);
            max-height: var(--app-height);
            box-sizing: border-box; /* Гарантируем, что отступы не ломают ширину экрана */
            position: relative;
        }

        h2 { font-size: 0.6rem; text-align: center; letter-spacing: 5px; color: var(--dim); text-transform: uppercase; margin: 5px 0; font-weight: 800; opacity: 0.6; }

        /* --- ТАБЛИЦА (Техпаспорт) --- */
        /* Добавили position: relative, чтобы слой держался внутри таблицы */
        .table { 
            width: 100%; background: var(--input-bg); border-radius: 8px; 
            min-width: 0;
            max-width: 100%;
            border: 1px solid var(--table-border); flex: 1; display: flex; 
            flex-direction: column; min-height: 0; overflow: hidden; margin-top: 5px;
            position: relative; 
        }

        /* --- ИКОНКИ (ПРОЗРАЧНЫЕ PNG) --- */
        .op-icon { 
            mix-blend-mode: normal; 
            filter: none;
            display: block;        /* Убирает влияние line-height шрифта */
            vertical-align: bottom; /* Прижимает к нижней границе контейнера */
        }
        html.dark-theme .op-icon { 
            /* Легкое осветление иконки для лучшей читаемости в ночном режиме (если нужно) */
            filter: brightness(1.8); 
        }

        #tableBody { flex: 1; overflow-y: auto; background: var(--row-bg); }

        #tableBody::-webkit-scrollbar { width: 4px; }
        #tableBody::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        #tableBody::-webkit-scrollbar-button { display: none; width: 0; height: 0; }

        .t-row { 
            display: grid; grid-template-columns: 1fr 1fr 0.25fr 1fr 1fr;
            height: 42px; padding: 0 18px; border-bottom: 1px solid var(--border); 
            align-items: center; font-size: 1.1rem; text-align: center;
            background-color: var(--row-bg); /* ИЗМЕНЕНИЕ: Динамический фон (белый днем, темный ночью) */
        }

        /* Динамическая зебра (автоматически меняется от темы) */
        #tableBody .t-row:nth-child(even) { 
            background-color: var(--zebra-bg) !important; 
        }

        /* Выделение 10-й строки (90° Beam) ТОЛЬКО для круглых курсов (19 строк) */
        #tableBody .t-row.beam-row { 
            background-color: rgba(14, 165, 233, 0.05) !important; /* Стерильный бледно-голубой цвет */
        }

        /* ВАРИАНТ 6: Неоновый экватор (Правило z-index: 20) */
        #tableBody .t-row.beam-divider { 
            position: relative; 
            border-bottom-color: transparent !important; 
        }

        /* Отрисовываем экватор поверх всех столбцов (включая ВПП) */
        #tableBody .t-row.beam-divider::after {
            content: '';
            position: absolute;
            bottom: 0; 
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--accent); 
            z-index: 20; 
            pointer-events: none;
            
            /* МАКСИМАЛЬНЫЙ НЕОН (4 СЛОЯ): Сверхъяркое ядро и глубокий ореол */
            box-shadow: 0 0 8px rgba(14, 165, 233, 1),   /* Ядро (Core) */
                        0 0 15px rgba(14, 165, 233, 0.8), /* Основной свет */
                        0 0 30px rgba(14, 165, 233, 0.4), /* Рассеивание (Halo) */
                        0 0 50px rgba(14, 165, 233, 0.2); /* Фоновое свечение */
        }

        /* Полоса (закрашенная ячейка сетки с маскировкой границ) */
        .rwy-divider { 
            height: 100%; width: 100%; background-color: var(--rwy-asphalt); 
            
            /* Шаг 45px (20px линия, 25px пустота) */
            background-image: repeating-linear-gradient(to bottom, var(--rwy-line) 0, var(--rwy-line) 20px, transparent 20px, transparent 45px); 
            
            background-size: 2px 100%; 
            background-repeat: repeat-y; 
            
            /* === ИЗМЕНЕНИЕ: Сдвигаем фон на 12.5px вниз для идеальной центровки штриха === */
            background-position: center 12.5px; 
            
            position: relative;
            z-index: 1; 
            box-shadow: 0 1px 0 var(--rwy-asphalt); 
        }

        .course-cell { font-weight: 800; }

       /* --- кнопки первая строка (ШРИФТЫ 1.1rem) --- расстояние между синей плашкой и кнопками , расстояние между заголовком и кнопками*/
        
        .controls-layout { 
            display: grid; 
            /* minmax(0, 1fr) гарантирует, что кнопка не растянется из-за текста внутри */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); 
            column-gap: 5px; /* Сохраняем горизонтальные зазоры между кнопками */
            row-gap: 0px;    /* <-- Убрали вертикальный зазор между текстом и кнопкой */
            margin-top: 5px; 
            align-items: center; /* Выравниваем базовые кнопки (40px) и высокое поле курса по нижней линии */
            min-width: 0;
            max-width: 100%;
        }
        .grid-label { font-size: 0.7rem; font-weight: 800; color: var(--dim); text-transform: uppercase; text-align: center; margin-bottom: 0px; /* <-- Убрали нижний отступ у текста */ }
        
        .action-btn, .data-input { 
            height: 40px; border-radius: 12px; border: 1px solid var(--border); 
            background: var(--input-bg); color: var(--text); 
            font-weight: 800; text-align: center; font-size: 1.1rem; 
            
            /* === БРОНЯ ОТ ВЫДЕЛЕНИЯ СПЕЦИАЛЬНО ДЛЯ INPUT === */
            /* Глобальный * { user-select: none } уже справляется, оставляем только каретку */
            caret-color: transparent; /* Полностью скрываем мигающий курсор текста */
        }

        /* --- Активное состояние для кнопок t/o и land --- */
        .action-btn.active-op {
            background: var(--accent);
            color: var(--card); /* Белый текст на синем фоне */
            border-color: var(--accent);
        }

        /* === НОВЫЙ СТИЛЬ: Неактивное состояние для модификаторов (бледные и серые) === */
        /* Применяется к кнопкам с атрибутом disabled */
        .action-btn:disabled {
            opacity: 0.35; /* Сильно бледная */
            filter: grayscale(100%); /* Абсолютно серая, теряет синий цвет */
            pointer-events: none; /* Жестко отключаем клики браузером */
            border-color: var(--border); /* Сбрасываем цвет рамки на нейтральный */
            color: var(--dim); /* Серый текст */
        }

        /* Индивидуальные стили для выделения поля RW COURSE */
        #windDirInput {
            height: 50px; 
            width: calc(100% + 2px); /* Расширяем поле на 6px */
            margin-left: -1px;       /* Притягиваем левую кнопку на 3px ближе */
            margin-right: -1px;      /* Притягиваем правую кнопку на 3px ближе */
            position: relative;      /* Гарантируем правильное наложение */
            z-index: 2; 
            justify-self: center;
            border: 2px solid var(--accent); /* Акцентная синяя рамка */
            color: var(--accent); /* Синий текст */
            font-size: 1.6rem;
            background: var(--card); /* Белый фон для контраста */
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.15); /* Легкое свечение */
        }
        .action-btn { cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; width: 100%; line-height: 1.1; }
        .action-btn small { font-size: 0.65rem; color: var(--dim); display: block; }

        /* --- КАРТОТЕКА И СПЕЦ-КНОПКИ --- ДВИГАТЬ ВСЮ БИБЛИОТЕКУ ВВЕРХ ВНИЗ*/
        .tabs-container { margin-top: 10px; display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
        
        .tab-line-wrapper {
            display: flex; align-items: flex-end; gap: 12px; width: 100%;
        }
        .tabs-container > .tab-line-wrapper:first-child { margin-bottom: -9px; position: relative; z-index: 10; }

        .tabs-row { display: grid; gap: 2px; flex: 1; }
        .tabs-row.upper { grid-template-columns: repeat(5, 1fr); }
        .tabs-row.lower { grid-template-columns: repeat(6, 1fr); }
        /* MAN нижний таб имеет 1 ячейку на всю ширину */
        .tabs-row.lower.atis-active { grid-template-columns: 1fr; }

        /* Разрешаем перенос длинного текста (с or) внутри кнопки ATIS */
        .tabs-row.lower.atis-active .tab-btn {
            white-space: normal;
            line-height: 1.1;
            padding: 4px;
        }

        .tab-btn { 
            height: 35px; background: #e2e8f0; border: 1px solid var(--border); 
            color: var(--dim); font-size: 0.8rem; font-weight: 800; 
            text-transform: none; /* <-- ИЗМЕНЕНИЕ: Отключили принудительный CAPS */
            cursor: pointer; border-radius: 8px 8px 0 0; 
        }
        .tab-btn.active { 
            background: var(--card); color: var(--accent); 
            border-bottom: 1px solid var(--card) !important; border-top: 3px solid var(--accent); 
        }

        /* Возвращаем видимую нижнюю границу для активных кнопок нижнего ряда */
        .tabs-row.lower .tab-btn.active {
            border-bottom: 1px solid var(--border) !important;
        }

        /* --- СТИЛЬ ДЛЯ МНОГОСТРОЧНОГО ТЕКСТА ATIS --- */
        .tab-btn.active.atis-display-btn {
            height: auto !important; 
            min-height: 35px;
            padding: 8px 4px; /* Внутренний отступ для комфортного чтения */
        }

        /* высота белого блока белый блок библиотеки табов */
        .tabs-content-area { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-top: 0;
            border-radius: 0 0 12px 12px; 
            padding: 17px 5px 5px 5px; /* Увеличили padding-top до 17px для имитации центра */
            flex: 1; 
            z-index: 5; 
            min-height: 60px;
            display: flex;
            align-items: flex-start; /* Фиксируем верхнюю границу кнопки */
        }
        .lower .tab-btn { border-radius: 8px; }

        .special-btn {
            width: 55px; height: 35px; border-radius: 8px !important; 
            background: var(--input-bg); /* Светло-серая по умолчанию (как LAND) */
            color: var(--text) !important; font-size: 0.65rem; font-weight: 800; 
            border: 1px solid var(--border); cursor: pointer; text-transform: uppercase; flex-shrink: 0;
        }
        .special-btn.active { 
            background: #f97316 !important; /* Ярко-оранжевая при активации */
            color: white !important; 
            border-color: #ea580c !important; 
        }
        
        #contBtn { margin-bottom: 12px; } 

        /* --- CSS ВРЕМЕННОЙ ПОДСКАЗКИ LAND --- */
        .hint-toast {
            position: absolute;
            bottom: 190px; /* Размещаем над рядом кнопок управления */
            left: 69%;
            transform: translateX(-50%);
            background: rgba(14, 165, 233, 0.9); /* Акцентный синий, полупрозрачный */
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 50; /* Выше таблицы, ниже модалки */
            white-space: nowrap;
            pointer-events: none; /* Чтобы тост не перехватывал нажатия */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* --- CSS ВРЕМЕННОЙ ПОДСКАЗКИ КУРСА (ОБРАТНЫЙ КУРС) --- */
        .course-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgb(119, 192, 247) !important; /* Чистый RGB без альфа-канала */
            color: #ffffff;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 3.5rem;
            font-weight: 900;
            z-index: 2000;
            pointer-events: none;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); /* Глубокая тень для выделения */
            opacity: 0;
            visibility: hidden;
        }
        html.dark-theme .course-toast {
            background: rgb(2, 115, 173) !important; /* Чистый RGB для ночи */
        }

        
        /* --- СТРОКА СТАТУСА LAND ПОД ТАБЛИЦЕЙ (ИНФОРМАЦИОННЫЙ СТИЛЬ) --- */
        .land-status-row {
            text-align: center;
            font-size: clamp(0.7rem, 3.5vw, 0.95rem); /* Увеличенный гибкий шрифт */
            font-weight: 900;
            color: var(--accent); 
            background-color: rgba(14, 165, 233, 0.12); 
            border: 1px solid rgba(14, 165, 233, 0.25); 
            border-radius: 6px; 
            padding: 5px 2px; 
            margin-top: 8px; 
            width: 100%; 
            letter-spacing: 1px; /* Сжали интервал, чтобы всё влезло */
            text-transform: uppercase;
            transition: opacity 0.3s ease, background-color 0.3s ease;
            opacity: 0; 
            pointer-events: none;
            white-space: nowrap; /* Жестко запрещаем перенос на вторую строку */
        }

        

        /* --- МОДАЛКИ --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        
        /* Базовое окно (остается по центру) */
        .modal-content { 
            background: var(--card); 
            border: 1px solid var(--accent); 
            border-radius: 16px; 
            padding: 10px; 
            width: 90%; 
            max-width: 420px; 
            box-shadow: var(--shadow); 
            
            /* === РЕШЕНИЕ ПРОБЛЕМЫ ВЫСОТЫ === */
            max-height: 95vh; /* Окно никогда не будет выше 85% высоты экрана */
            overflow-y: auto; /* Включаем вертикальную прокрутку, если контент не влез */

    <script>
        (function() {
            const STATUS_BAR_LIGHT = '#f1f5f9';
            const STATUS_BAR_DARK = '#0b0f19';
            const ensureMeta = (name, content) => {
                let meta = document.querySelector(`meta[name="${name}"]`);
                if (!meta) {
                    meta = document.createElement('meta');
                    meta.setAttribute('name', name);
                    document.head.appendChild(meta);
                }
                meta.setAttribute('content', content);
                if (name === 'theme-color') meta.removeAttribute('media');
                return meta;
            };
            const applyTheme = theme => {
                const isDark = theme === 'dark';
                document.documentElement.classList.toggle('dark-theme', isDark);
                if (document.body) document.body.classList.toggle('dark-theme', isDark);
                ensureMeta('theme-color', isDark ? STATUS_BAR_DARK : STATUS_BAR_LIGHT);
                ensureMeta('apple-mobile-web-app-status-bar-style', isDark ? 'black' : 'default');
            };
            applyTheme(localStorage.getItem('hub_theme'));
            document.addEventListener('DOMContentLoaded', () => applyTheme(localStorage.getItem('hub_theme')));
            window.addEventListener('storage', (event) => {
                if (event.key === 'hub_theme') {
                    applyTheme(event.newValue);
                }
            });
        })();
    </script>
    <script>
        (function () {
            if (window.MyFlightViewportLock) {
                window.MyFlightViewportLock.relock();
                return;
            }

            const root = document.documentElement;
            const isIPad = /iPad/.test(window.navigator.userAgent) || (
                window.navigator.platform === 'MacIntel' &&
                window.navigator.maxTouchPoints > 1
            );
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            root.classList.toggle('is-ipad', isIPad);
            root.classList.toggle('is-standalone', isStandalone);
            const containerSelector = '.app-shell, .app-wrapper, .calculator, .app-container';
            const relockSteps = [60, 150, 350, 700, 1200];
            let lockedHeight = 0;

            function isEditable(element) {
                return Boolean(element && (
                    /^(INPUT|TEXTAREA|SELECT)$/.test(element.tagName) ||
                    element.isContentEditable
                ));
            }

            function isEditableFocused() {
                return isEditable(document.activeElement);
            }

            function keepViewportPinned() {
                root.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
                window.scrollTo(0, 0);
            }

            function readViewportWidth(visualViewport) {
                const widths = [
                    visualViewport ? visualViewport.width : 0,
                    window.innerWidth,
                    root.clientWidth,
                    window.outerWidth
                ].map(Number).filter(width => Number.isFinite(width) && width > 0);
                return Math.floor(widths.length ? Math.min(...widths) : 0);
            }

            function readViewportHeight(visualViewport, editableFocused) {
                const visualHeight = visualViewport ? Math.floor(visualViewport.height || 0) : 0;
                const innerHeight = Math.floor(window.innerHeight || 0);
                const rootHeight = Math.floor(root.clientHeight || 0);
                const isStandaloneIPad = root.classList.contains('is-standalone') && root.classList.contains('is-ipad');
                if (!editableFocused && isStandaloneIPad) {
                    return Math.max(innerHeight, visualHeight, rootHeight);
                }
                if (!editableFocused && visualHeight) return visualHeight;
                return innerHeight || visualHeight || rootHeight || lockedHeight || 0;
            }

            function lockViewport(options = {}) {
                const forceHeight = Boolean(options.forceHeight || options.resetHeight);
                const visualViewport = window.visualViewport;
                const editableFocused = isEditableFocused();
                const viewportWidth = readViewportWidth(visualViewport);
                const nextHeight = readViewportHeight(visualViewport, editableFocused);
                const visualHeight = visualViewport ? Math.floor(visualViewport.height || 0) : nextHeight;
                const innerHeight = Math.floor(window.innerHeight || 0);
                const keyboardLikelyOpen = editableFocused && lockedHeight && (
                    (visualHeight && visualHeight < lockedHeight - 80) ||
                    (innerHeight && innerHeight < lockedHeight - 80) ||
                    (nextHeight && nextHeight < lockedHeight - 80)
                );

                if (!lockedHeight || forceHeight) {
                    lockedHeight = nextHeight || innerHeight || lockedHeight;
                } else if (!keyboardLikelyOpen && !editableFocused && nextHeight) {
                    lockedHeight = nextHeight;
                }

                const staticHeight = `${lockedHeight || nextHeight || innerHeight}px`;
                const appWidth = `${Math.min(viewportWidth || window.innerWidth || 440, 440)}px`;

                root.style.setProperty('--app-height', staticHeight);
                root.style.setProperty('--app-width', appWidth);
                root.style.height = staticHeight;

                if (document.body) {
                    document.body.style.height = staticHeight;
                }

                if (viewportWidth && viewportWidth < 440) {
                    const rootWidth = `${viewportWidth}px`;
                    root.style.width = rootWidth;
                    if (document.body) document.body.style.width = rootWidth;
                } else {
                    root.style.width = '100%';
                    if (document.body) document.body.style.width = '100%';
                }

                document.querySelectorAll(containerSelector).forEach(container => {
                    container.style.height = staticHeight;
                    container.style.width = appWidth;
                });

                if (keyboardLikelyOpen || editableFocused) {
                    keepViewportPinned();
                    setTimeout(keepViewportPinned, 50);
                }
            }

            function relockViewport() {
                lockedHeight = 0;
                lockViewport({ forceHeight: true });
                if (typeof requestAnimationFrame === 'function') {
                    requestAnimationFrame(() => lockViewport({ forceHeight: true }));
                }
                relockSteps.forEach(delay => {
                    setTimeout(() => lockViewport({ forceHeight: true }), delay);
                });
            }

            window.MyFlightViewportLock = {
                lock: lockViewport,
                relock: relockViewport,
                reset: relockViewport,
                getHeight: () => lockedHeight
            };

            relockViewport();
            document.addEventListener('DOMContentLoaded', relockViewport, { once: true });
            window.addEventListener('pageshow', relockViewport);
            window.addEventListener('focus', relockViewport);
            window.addEventListener('resize', () => lockViewport());
            window.addEventListener('orientationchange', relockViewport);

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => lockViewport());
                window.visualViewport.addEventListener('scroll', () => lockViewport());
            }

            document.addEventListener('focusin', event => {
                if (!isEditable(event.target)) return;
                lockViewport();
                keepViewportPinned();
                setTimeout(keepViewportPinned, 100);
            }, true);
            document.addEventListener('focusout', () => setTimeout(() => lockViewport(), 250), true);

            if ('virtualKeyboard' in navigator) {
                navigator.virtualKeyboard.overlaysContent = true;
                navigator.virtualKeyboard.addEventListener?.('geometrychange', () => lockViewport());
            }
        })();
    </script>

<script>
    (function () {
        window.MyFlightViewportLock?.relock();
    })();

    // Убираем '-' и дубликаты. Добавляем плейсхолдер 5_GROUP для динамической кнопки.
    const tabPresets = {
        'RWYCC': ['6', '5_GROUP', '4', '3', '2', '1'],
        'µнорм': ['DRY', '≥ 0.50', '0.49-0.45', '0.44-0.40', '0.39-0.35', '0.34-0.30'],
        'ESF': ['DRY', 'GOOD', 'GOOD to MEDIUM', 'MEDIUM', 'MEDIUM to POOR', 'POOR'],
        'µизм': ['DRY', '≥ 0.51', '0.50-0.45', '0.44-0.36', '0.35-0.26', '0.25-0.17']
    };

    const rwyMapping = [
        { 'RWYCC': '6', 'ESF': 'DRY', 'µнорм': 'DRY', 'µизм': 'DRY', 'MAN_ROW': 0, 'MAN_DEFAULT': 'DRY' },
        { 'RWYCC': '5', 'ESF': 'GOOD', 'µнорм': '≥ 0.50', 'µизм': '≥ 0.51', 'MAN_ROW': 1, 'MAN_DEFAULT': 'DAMP OR WET: ≤ 3 mm of water' },
        { 'RWYCC': '5S', 'ESF': 'GOOD', 'µнорм': '≥ 0.50', 'µизм': '≥ 0.51', 'MAN_ROW': 2, 'MAN_DEFAULT': 'SLUSH: ≤ 3 mm Or DRY SNOW: ≤ 3 mm Or WET SNOW: ≤ 3 mm Or FROST' },
        { 'RWYCC': '4', 'ESF': 'GOOD to MEDIUM', 'µнорм': '0.49-0.45', 'µизм': '0.50-0.45', 'MAN_ROW': 3, 'MAN_DEFAULT': 'Compacted Snow: OAT ≤ -15°C' },
        { 'RWYCC': '3', 'ESF': 'MEDIUM', 'µнорм': '0.44-0.40', 'µизм': '0.44-0.36', 'MAN_ROW': 4, 'MAN_DEFAULT': 'Dry Snow: > 3 mm, ≤ 50 mm <span style="color: var(--dim);">Or</span> Wet Snow: > 3 mm, ≤ 12.7 mm <span style="color: var(--dim);">Or</span> Compacted Snow: OAT > -15°C <span style="color: var(--dim);">Or</span> Slippery Wet' },
        { 'RWYCC': '2', 'ESF': 'MEDIUM to POOR', 'µнорм': '0.39-0.35', 'µизм': '0.35-0.26', 'MAN_ROW': 5, 'MAN_DEFAULT': 'Standing Water: > 3 mm <span style="color: var(--dim);">Or</span> Slush: > 3 mm' },
        { 'RWYCC': '1', 'ESF': 'POOR', 'µнорм': '0.34-0.30', 'µизм': '0.25-0.17', 'MAN_ROW': 6, 'MAN_DEFAULT': 'Ice: Cold and Dry' },
        { 'RWYCC': '-', 'ESF': 'POOR', 'µнорм': '< 0.30', 'µизм': '< 0.17', 'MAN_ROW': 7, 'MAN_DEFAULT': 'Wet Ice Or Water on top of Compacted Snow Or Dry/Wet Snow over Ice' }
    ];

    let currentMappingIndex = 0, currentCategory = 'RWYCC';
    let currentRwycc5State = '5'; 
    let selectedManValue = rwyMapping[0]['MAN_DEFAULT']; // Инициализируем из базы
    const PATH_SWITCH_STORAGE_KEY = 'rwyWind_path_target';
    const TABLE_SCROLL_STORAGE_KEY = 'rwyWind_tableScrollTop';
    const PATH_SWITCH_HOLD_MS = 300;
    const pathSwitchTargets = {
        mypath: {
            href: './mypath.html',
            label: 'MyPath',
            title: 'Калькулятор глиссады',
            icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>'
        },
        mynpa: {
            href: './mynpa.html',
            label: 'MyNPA',
            title: 'NPA calculator',
            icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; display: block;"><circle cx="12" cy="12" r="9"></circle><path d="M12 5v14"></path><path d="m9.5 7 2.5-3 2.5 3"></path><circle cx="6.5" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="9" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="15" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="17.5" cy="12" r="0.8" fill="currentColor" stroke="none"></circle></svg>'
        }
    };
    let currentPathSwitchTarget = localStorage.getItem(PATH_SWITCH_STORAGE_KEY) === 'mynpa' ? 'mynpa' : 'mypath';
    let pathSwitchPressTimer;
    let isPathSwitchLongPress = false;
    let isTableScrollPersistenceAttached = false;

    window.onload = () => {
        renderPathSwitchButton();
        attachTableScrollPersistence();
        const isLoaded = loadAppState(); // Пытаемся загрузить сохраненную сессию

        if (!isLoaded) {
            // Если ничего не загружено (первый запуск или кэш сброшен), ставим дефолт
            selectedManValue = rwyMapping[currentMappingIndex]['MAN_DEFAULT'];
        } else {
            // Если сессия загружена, синхронизируем UI верхних вкладок с переменной currentCategory
            document.querySelectorAll('.tabs-row.upper .tab-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.trim() === currentCategory);
            });
        }
        
        updateLowerTabs({ center: false });
        toggleOpMode(currentOpMode, { center: false }); 
        // Принудительно проявляем плашку сразу после загрузки
        document.getElementById('landStatusRow').style.opacity = '1';
        if (typeof updateLandModalUI === 'function') updateLandModalUI({ center: false }); // Применяем блокировки CAT2
        restoreTableScrollPosition(); 
    };

    function renderPathSwitchButton() {
        const config = pathSwitchTargets[currentPathSwitchTarget] || pathSwitchTargets.mypath;
        const button = document.getElementById('windPathSwitchBtn');
        const iconHolder = document.getElementById('pathSwitchIconHolder');
        const label = document.getElementById('pathSwitchLabel');
        if (button) {
            button.href = config.href;
            button.title = config.title;
            button.setAttribute('aria-label', config.label);
        }
        if (iconHolder) iconHolder.innerHTML = config.icon;
        if (label) label.textContent = config.label;
    }

    function setPathSwitchTarget(target) {
        currentPathSwitchTarget = target === 'mynpa' ? 'mynpa' : 'mypath';
        localStorage.setItem(PATH_SWITCH_STORAGE_KEY, currentPathSwitchTarget);
        renderPathSwitchButton();
    }

    function togglePathSwitchTarget() {
        setPathSwitchTarget(currentPathSwitchTarget === 'mypath' ? 'mynpa' : 'mypath');
    }

    function startPressPathSwitch(e) {
        if (e && e.button !== undefined && e.button !== 0) return;
        isPathSwitchLongPress = false;
        clearTimeout(pathSwitchPressTimer);
        pathSwitchPressTimer = setTimeout(() => {
            isPathSwitchLongPress = true;
            togglePathSwitchTarget();
        }, PATH_SWITCH_HOLD_MS);
    }

    function endPressPathSwitch() {
        clearTimeout(pathSwitchPressTimer);
    }

    function cancelPressPathSwitch() {
        clearTimeout(pathSwitchPressTimer);
        isPathSwitchLongPress = false;
    }

    function clickPathSwitch(e) {
        if (isPathSwitchLongPress) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            isPathSwitchLongPress = false;
            return false;
        }
        saveTableScrollPosition();
        return true;
    }

    function getTableScrollMax(tableBody) {
        return Math.max(0, tableBody.scrollHeight - tableBody.clientHeight);
    }

    function clampTableScrollTop(tableBody, scrollTop) {
        const numericScrollTop = Number(scrollTop);
        if (!Number.isFinite(numericScrollTop)) return null;
        return Math.min(Math.max(0, numericScrollTop), getTableScrollMax(tableBody));
    }

    function getSavedTableScrollTop() {
        try {
            const savedScrollTop = sessionStorage.getItem(TABLE_SCROLL_STORAGE_KEY);
            if (savedScrollTop === null) return null;
            const parsedScrollTop = parseFloat(savedScrollTop);
            return Number.isFinite(parsedScrollTop) ? parsedScrollTop : null;
        } catch (e) {
            return null;
        }
    }

    function saveTableScrollPosition() {
        const tableBody = document.getElementById('tableBody');
        if (!tableBody) return;
        try {
            sessionStorage.setItem(TABLE_SCROLL_STORAGE_KEY, String(Math.round(tableBody.scrollTop)));
        } catch (e) {}
    }

    function restoreTableScrollPosition() {
        setTimeout(() => {
            const tableBody = document.getElementById('tableBody');
            if (!tableBody || tableBody.children.length === 0) return;
            const savedScrollTop = getSavedTableScrollTop();

            if (savedScrollTop === null) {
                centerTable();
                return;
            }

            const restoredScrollTop = clampTableScrollTop(tableBody, savedScrollTop);
            if (restoredScrollTop === null) return;
            tableBody.scrollTop = restoredScrollTop;
            saveTableScrollPosition();
        }, 0);
    }

    function attachTableScrollPersistence() {
        const tableBody = document.getElementById('tableBody');
        if (!tableBody || isTableScrollPersistenceAttached) return;
        isTableScrollPersistenceAttached = true;
        tableBody.addEventListener('scroll', saveTableScrollPosition, { passive: true });
        window.addEventListener('pagehide', saveTableScrollPosition);
    }

    function selectTab(el) {
        // Используем textContent и нормализуем пробелы, чтобы внедренные <br> не ломали логику поиска
        const val = el.textContent.trim().replace(/\s+/g, ' ');
        if (el.parentElement.classList.contains('upper')) {
            currentCategory = val;
            el.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === el));
            updateLowerTabs({ center: false });
        } else {
            // Если в нижнем табе ATIS нажали на кнопку выбора — открываем модалку
            if (currentCategory === 'ATIS') {
                openManModal();
            } else {
                const idx = rwyMapping.findIndex(i => i[currentCategory] === val);
                if (idx !== -1) { 
                    currentMappingIndex = idx; 
                    // Обновляем значение MAN, чтобы оно соответствовало новому индексу RWYCC/ESF
                    selectedManValue = rwyMapping[idx]['MAN_DEFAULT'];
                    updateLowerTabs({ center: false }); 
                }
            }
        }
    }

    function updateLowerTabs(options = {}) {
        const container = document.getElementById('lowerTabsContainer');
        const isAtis = currentCategory === 'ATIS';
        
        container.classList.toggle('atis-active', isAtis);

        if (isAtis) {
            let formattedText = selectedManValue
                .replace(/ OR /gi, ' <span class="atis-or">Or</span> ')
                .replace(/More than 3 mm, up to 50 mm/gi, '> 3 mm, ≤ 50 mm')
                .replace(/More than 3 mm, up to 12\.7 mm/gi, '> 3 mm, ≤ 12.7 mm')
                .replace(/More than 3 mm/gi, '> 3 mm')
                .replace(/Up to 3 mm of water/gi, '≤ 3 mm of water')
                .replace(/Up to 3 mm/gi, '≤ 3 mm')
                .replace(/OAT -15°C or colder/gi, 'OAT ≤ -15°C')
                .replace(/OAT above -15°C/gi, 'OAT > -15°C');
            
            // Динамический расчет: чем больше символов, тем меньше шрифт и плотнее строки
            const len = formattedText.length;
            let dynSize = '1.0rem'; 
            let dynLH = '1.1';

            if  (len > 75) { 
                dynSize = '0.9rem'; dynLH = '1.0'; 
            } else if (len > 120) { 
                dynSize = '3.8rem'; dynLH = '1.0'; 
            }

            //высота ATIS кнопки
            // Добавлено свойство margin-top: 10px; для визуального смещения кнопки вниз
            container.innerHTML = `
                <button class="tab-btn active" style="margin-top: 0px; border-radius: 8px; width: 100%; min-height: 35px; height: auto; padding: 4px; display: flex; align-items: center; justify-content: center; text-align: center; text-transform: none; line-height: ${dynLH}; font-size: ${dynSize}; white-space: normal;" onclick="openManModal()">
                    <div style="width: 100%;">${formattedText}</div>
                </button>
            `;
        } else {
            const labels = tabPresets[currentCategory] || tabPresets['RWYCC'];
            const activeVal = rwyMapping[currentMappingIndex][currentCategory];
            
            // Устанавливаем свойства контейнера для жесткой сетки
            container.style.display = 'flex';
            container.style.gap = '4px';

            container.innerHTML = labels.map(l => {
                let fontSize = currentCategory === 'RWYCC' ? '1.2rem' : '0.65rem';
                let displayText = l;
                let lh = '1.1';

                // Динамическое уменьшение шрифта и принудительный перенос для длинных текстов ESF
                if (currentCategory === 'ESF' && l.includes('to')) {
                    // Индивидуальная логика переноса
                    if (l === 'GOOD to MEDIUM') {
                        displayText = 'GOOD to <br> MEDIUM'; 
                    } else if (l === 'MEDIUM to POOR') {
                        displayText = 'MEDIUM <br> to POOR'; 
                    }
                    
                    // Функция clamp() будет плавно сжимать шрифт на маленьких экранах
                    fontSize = 'clamp(0.45rem, 2.5vw, 0.55rem)'; 
                    lh = '1.2';
                }
                
                // baseStyle обновлен для поддержки динамического переноса
                const baseStyle = `flex: 1; min-width: 0; height: 35px; border-radius: 8px; font-size: ${fontSize}; 
                                   white-space: normal; line-height: ${lh}; display: flex; align-items: center; 
                                   justify-content: center; text-align: center; padding: 0 2px; text-transform: none;`;

                if (l === '5_GROUP') {
                    const isActive = (currentMappingIndex === 1 || currentMappingIndex === 2) && currentCategory === 'RWYCC';
                    return `
                        <button class="tab-btn ${isActive ? 'active' : ''}" 
                            style="${baseStyle} touch-action: pan-y;" 
                            onpointerdown="startPress5(event)" 
                            onpointerup="endPress5(event)" 
                            onpointerleave="cancelPress5()" 
                            oncontextmenu="event.preventDefault()">
                            <div style="width: 100%;">${currentRwycc5State}</div>
                        </button>
                    `;
                } else {
                    const isActive = (l === activeVal);
                    // Мы оборачиваем текст в <div>, чтобы flex-выравнивание работало корректно для многострочного текста
                    return `
                        <button class="tab-btn ${isActive ? 'active' : ''}" 
                            style="${baseStyle}" 
                            onclick="selectTab(this)">
                            <div style="width: 100%;">${displayText}</div>
                        </button>
                    `;
                }
            }).join('');
        }
        updateTable(options);
    }
    

    // === ЛОГИКА ДОЛГОГО НАЖАТИЯ ДЛЯ 5/5S ===
    let longPressTimer;
    let isLongPress = false;

    function startPress5(e) {
        if (e.button !== undefined && e.button !== 0) return; // Игнорируем правую кнопку мыши
        isLongPress = false;
        longPressTimer = setTimeout(() => {
            isLongPress = true;
            openRwycc5Modal(); // Открываем выбор 5 или 5S
        }, 300); // 300 мс удержания
    }

    function endPress5(e) {
        clearTimeout(longPressTimer);
        if (!isLongPress) {
            currentCategory = 'RWYCC';
            currentMappingIndex = (currentRwycc5State === '5S') ? 2 : 1;
            
            // СИНХРОНИЗАЦИЯ
            selectedManValue = rwyMapping[currentMappingIndex]['MAN_DEFAULT'];
            
            document.querySelectorAll('.tabs-row.upper .tab-btn').forEach(b => {
                b.classList.toggle('active', b.innerText.trim() === 'RWYCC');
            });
            updateLowerTabs({ center: false });
        }
    }

    function cancelPress5() {
        clearTimeout(longPressTimer); // Отмена, если палец соскользнул
    }

    // === УПРАВЛЕНИЕ ОКНОМ 5/5S ===
    function openRwycc5Modal() { 
        // Находим кнопки 5 и 5S внутри модалки
        const btns = document.getElementById('rwycc5Modal').querySelectorAll('.action-btn');
        
        // Сравниваем текст кнопки с текущим состоянием и вешаем/снимаем выделение
        btns.forEach(btn => {
            btn.classList.toggle('active-op', btn.innerText.trim() === currentRwycc5State);
        });
        
        // Показываем саму модалку
        document.getElementById('rwycc5Modal').classList.add('active'); 
    }
    function closeRwycc5Modal() { document.getElementById('rwycc5Modal').classList.remove('active'); }
    
    function selectRwycc5(val) {
        currentRwycc5State = val; // Сохраняем "5" или "5S"
        currentCategory = 'RWYCC';
        currentMappingIndex = (val === '5S') ? 2 : 1; // Устанавливаем правильный индекс
        
        // СИНХРОНИЗАЦИЯ С MAN
        selectedManValue = rwyMapping[currentMappingIndex]['MAN_DEFAULT'];
        
        document.querySelectorAll('.tabs-row.upper .tab-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.trim() === 'RWYCC');
        });
        
        closeRwycc5Modal();
        updateLowerTabs({ center: false });
    }

    // === ЛОГИКА СИНХРОНИЗАЦИИ КНОПОК В ОКНЕ MAN ===
    function updateManModalUI() {
        const manButtons = document.querySelectorAll('#manModal .man-btn');
        
        // 1. Очищаем выбранное значение от HTML-тегов (span), чтобы split сработал корректно
        const cleanSelected = selectedManValue.replace(/<[^>]*>/g, '');
        const activeParts = cleanSelected.split(/ OR /i).map(s => s.trim().toLowerCase());

        manButtons.forEach(btn => {
            btn.classList.remove('active-op');
            
            // 2. Берем базовый текст кнопки
            const originalBtnText = btn.textContent.replace(/\s+/g, ' ').trim();
            const lowerBtnText = originalBtnText.toLowerCase();
            
            // 3. Сжимаем длинный текст кнопки до коротких математических символов (как в rwyMapping)
            const shortBtnText = originalBtnText
                .replace(/More than 3 mm, up to 50 mm/gi, '> 3 mm, ≤ 50 mm')
                .replace(/More than 3 mm, up to 12\.7 mm/gi, '> 3 mm, ≤ 12.7 mm')
                .replace(/More than 3 mm/gi, '> 3 mm')
                .replace(/Up to 3 mm of water/gi, '≤ 3 mm of water')
                .replace(/Up to 3 mm/gi, '≤ 3 mm')
                .replace(/OAT -15°C or colder/gi, 'OAT ≤ -15°C')
                .replace(/OAT above -15°C/gi, 'OAT > -15°C')
                .toLowerCase();

    let activeKp = null, kpVal = "", isKpError = false;
    
    function openKeypad(id) { 
        activeKp = document.getElementById(id); 
        kpVal = ""; // Сбрасываем ВВОД, но плейсхолдер покажет текущее значение
        isKpError = false; // Сбрасываем флаг ошибки при открытии
        document.getElementById('kpValue').style.color = 'var(--accent)'; // Возвращаем цвет по умолчанию на всякий случай
        updateKp(); 
        document.getElementById('keypadModal').classList.add('active'); 
    }
    
    function closeKeypad(e) { 
        if (e === 'done' && activeKp) {
            // Если пилот нажал ОК, но ничего не ввел — просто закрываем
            if (kpVal === "") {
                document.getElementById('keypadModal').classList.remove('active');
                return;
            }
            
            let num = parseInt(kpVal, 10);
            if (isNaN(num) || num < 1 || num > 360) {
                isKpError = true; // <--- Включаем режим ошибки
                const valDisplay = document.getElementById('kpValue');
                valDisplay.style.color = '#ef4444'; // Подсвечиваем красным
                setTimeout(() => { valDisplay.style.color = 'var(--accent)'; }, 500);
                return; 
            }
            // Форматируем число (3 цифры) и приклеиваем знак градуса
            activeKp.textContent = num.toString().padStart(3, '0') + '°';
            updateTable({ center: true });
            kpVal = "";
            isKpError = false; // Сбрасываем флаг при успешном вводе
        }
        document.getElementById('keypadModal').classList.remove('active'); 
    }
    
    function kpPress(k) { 
        if (k === 'backspace') {
            if (isKpError) {
                // Если поле горело красным, Backspace просто сбрасывает ошибку и очищает ввод
                kpVal = ""; 
                isKpError = false;
                document.getElementById('kpValue').style.color = 'var(--accent)';
            } else {
                // В нормальном режиме удаляем последний символ
                kpVal = kpVal.slice(0, -1);
            }
        } else {
            // === ИЗМЕНЕНИЕ: Если предыдущий ввод был с ошибкой, начинаем набирать заново! ===
            if (isKpError) {
                kpVal = k; // Записываем новую цифру вместо старого значения
                isKpError = false; // Снимаем флаг ошибки
                document.getElementById('kpValue').style.color = 'var(--accent)'; // Мгновенно сбрасываем красный цвет
            } else if (kpVal.length < 3) {
                kpVal += k; 
            }
        }
        updateKp(); 
    }
    
    function updateKp() { 
        const d = document.getElementById('kpValue'); 
        const isCourse = activeKp && activeKp.id === 'windDirInput';
        
        // Очищаем старое значение от знака градуса для чистой математики
        let placeholder = activeKp ? activeKp.textContent.replace('°', '') : "000";
        
        // Формируем то, что будет на экране
        let displayValue = kpVal || placeholder;
        
        // Если это окно курса, приклеиваем градус "°" на лету к активному ИЛИ бледному тексту
        if (isCourse && displayValue !== "") {
            displayValue += "°";
        }
        
        d.textContent = displayValue; 
        d.style.opacity = kpVal ? "1" : "0.3"; 
    }

    // === ЛОГИКА ПОЛЯ RW COURSE (Быстрый тап = Keypad, Долгий тап = обратный курс) ===
    let windDirPressTimer;
    let isWindDirLongPress = false;

    function startPressWindDir(e) {
        if (e && e.button !== undefined && e.button !== 0) return;
        isWindDirLongPress = false; // Сбрасываем флаг при каждом новом касании
        
        windDirPressTimer = setTimeout(() => {
            isWindDirLongPress = true; // Фиксируем долгий тап
            
            const input = document.getElementById('windDirInput');
            let currentCourse = parseInt(input.textContent.replace('°', ''), 10);
            if (isNaN(currentCourse) || currentCourse === 0) currentCourse = 243;
            
            let reciprocal = currentCourse + 180;
            if (reciprocal > 360) reciprocal -= 360;
            
            let newCourseStr = reciprocal.toString().padStart(3, '0') + '°';
            input.textContent = newCourseStr;
            
            updateTable({ center: true });

            // === НОВОЕ ОКНО: Показ курса с микро-задержкой CSS ===
            const cToast = document.getElementById('courseToast');
            cToast.textContent = newCourseStr;
            
            // Очищаем старый цикл, если пилот нажал курс дважды
            if (cToast.hideTimeout) clearTimeout(cToast.hideTimeout);
            
            // 1. Подготовка: окно прозрачно, но активно для рендера
            cToast.style.transition = 'none'; 
            cToast.style.opacity = '0';
            cToast.style.visibility = 'visible';
            
            // 2. Принудительный кадр
            void cToast.offsetWidth; 
            
            // 3. ФАЗА 1 (Fade In): Плавное появление до пика за 0.7 секунды
            cToast.style.transition = 'opacity 0.7s ease-out';
            cToast.style.opacity = '1';
            
            // 4. ФАЗА 2 (Fade Out): Ровно через 0.7с (в момент пика) запускаем затухание
            cToast.hideTimeout = setTimeout(() => {
                cToast.style.transition = 'opacity 0.7s ease-in';
                cToast.style.opacity = '0';
                // Скрываем элемент из DOM после завершения анимации (через 0.7с)
                setTimeout(() => { cToast.style.visibility = 'hidden'; }, 700);
            }, 700);

        }, 300);
    }

    // === 1. БАЗА ДАННЫХ ===
    const baseWindLimitsDB = {
        '6_CEO_LDG': 38, '6_NEO_TO': 35, '5': 33, '5S': 29, '4': 29, '3': 25, '2': 20, '1': 15,
        'NARROW_CONT': 10
    };

    // === 2. ДИСПЕТЧЕР ЛИМИТОВ (Связан с твоими переменными) ===
    function getActiveLimitsData() {
        const isTO = currentOpMode === 'courseMinusBtn';
        const isLand = !isTO;
        const acTypeStr = document.getElementById('acTypeBtn').innerText.toUpperCase();
        const crewStr = document.getElementById('crewBtn').innerText.toUpperCase();
        
        // Считываем состояние новой объединенной кнопки
        const isNarrowCont = document.getElementById('narrowContBtn').classList.contains('active');

        // --- ЭТАП А: МАНУАЛЬНЫЕ ЛИМИТЫ ---
        let base_xw = null;
        let base_tw = isTO ? 15 : 10; 
        const rwycc = currentMappingIndex === 7 ? '-' : rwyMapping[currentMappingIndex]['RWYCC'];

        if (rwycc === '-') {
            base_xw = null; // PROHIBITED
        } else if (isNarrowCont && ['4', '3', '2', '1'].includes(rwycc)) {
            base_xw = 10; // Штраф применяется, если кнопка нажата и RWYCC <= 4
        } else if (rwycc === '6') {
            base_xw = (isTO && acTypeStr.includes('NEO')) ? 35 : 38;
        } else {
            base_xw = baseWindLimitsDB[rwycc];
        }

        // Ограничения экипажа (только к XW)
        if (base_xw !== null) {
            if (crewStr.includes('50%')) {
                base_xw *= 0.5;
            } else if (crewStr.includes('2П')) {
                base_xw *= 0.8; // Сработает для "2П 80%" и базового "2П"
            }
        }

        // --- ЭТАП Б: ЛИМИТЫ АВТОМАТИКИ ---
        let auto_hw = null, auto_xw = null, auto_tw = null;
        if (isLand) {
            const isAutoland = currentLandBase === 'AUTO';
            const isCat2 = (currentLandBase === 'MANUAL' && landMods['MANUAL_CAT2']);
            const isAutoroll = landMods['AUTO_ROLL'];

            const isA321 = acTypeStr.includes('321');
            const isNeo = acTypeStr.includes('NEO');
            const isWinglet = acTypeStr.includes('WINGLET') || acTypeStr.includes(' W');

            if (isAutoland) {
                auto_tw = 10;
                if (isA321 && isNeo) {
                    auto_hw = 15; auto_xw = 10;
                } else if (!isA321 && isWinglet) {
                    auto_hw = 30; auto_xw = isAutoroll ? 15 : 20;
                } else {
                    auto_hw = 30; auto_xw = 20;
                }
            } else if (isCat2 && isA321 && !isNeo) {
                // CAT2 Automatic Approach without Autoland актуально ТОЛЬКО для A321 и A321 Winglet
                auto_tw = 10;
                auto_hw = 40; 
                auto_xw = 25;
            }
        }
        return { base_xw, base_tw, auto_hw, auto_xw, auto_tw };
    }

    // === 3. РЕНДЕР ТАБЛИЦЫ (Сохраняет твою верстку) ===
    function updateTable(options = {}) {
    const tableBody = document.getElementById('tableBody');
    if (!tableBody) return;
    const shouldCenter = options.center === true;
    const previousScrollTop = tableBody.scrollTop;
    
    // ВАЖНО: Читаем textContent, так как поле курса теперь <div>, а не <input>
    let rwCourseStr = document.getElementById('windDirInput').textContent.replace('°', '');
    let rwCourse = parseInt(rwCourseStr, 10);
    if (isNaN(rwCourse) || rwCourse === 0) rwCourse = 243;

    const rawLimits = getActiveLimitsData();
    const limitsData = { ...rawLimits };

    
    let h = '';

    // ---- НОВАЯ ЛОГИКА ГЕНЕРАЦИИ СТОЛБЦОВ КУРСА ВЕТРА ----
    let isRoundCourse = (rwCourse % 10 === 0);
    let rowCount = isRoundCourse ? 19 : 18; // 19 строк для круглых, 18 для смещенных

    // Формируем стартовые точки компаса для левой и правой колонки
    let startL = Math.floor(rwCourse / 10) * 10;
    let startR = Math.ceil(rwCourse / 10) * 10;
    
    if (isRoundCourse) {
        // Для круглых курсов колонки начинаются одинаково (симметрично)
        startR = startL; 
    } else if (startL === startR) {
        // Защита от дубликатов для смещенных курсов
        startR += 10; 
    }

    // Корректируем компасные значения 1-360
    if (startL <= 0) startL += 360;
    if (startR > 360) startR -= 360;
    if (startR === 0) startR = 360;

    // Вспомогательная функция для расчета лимита на основе ТОЧНОГО угла отклонения
    function getLimitStr(diff) {
        let currentMaxLimit = Infinity;
        let angleRad = diff * Math.PI / 180;

        let ignoreXW = false;
        // Игнорируем XW для малых углов. Теперь diff - это точный угол до градуса.
        if (diff <= 10 || diff >= 170) {
            ignoreXW = true; 
        } else if ((diff <= 20 || diff >= 160) && currentMappingIndex < 4) {
            ignoreXW = true;
        }

        // Мануальные лимиты
        if (diff > 0 && diff <= 90) { 
            if (!ignoreXW) currentMaxLimit = Math.min(currentMaxLimit, limitsData.base_xw / Math.sin(angleRad));
        } else if (diff > 90 && diff < 180) { 
            let tailRad = (180 - diff) * Math.PI / 180;
            if (!ignoreXW) currentMaxLimit = Math.min(currentMaxLimit, limitsData.base_xw / Math.sin(tailRad));
            currentMaxLimit = Math.min(currentMaxLimit, limitsData.base_tw / Math.cos(tailRad));
        } else if (diff === 180) {
            currentMaxLimit = Math.min(currentMaxLimit, limitsData.base_tw);
        }

        // Лимиты автоматики
        if (limitsData.auto_xw !== null) {
            if (diff >= 0 && diff <= 90) {
                if (diff !== 90 && limitsData.auto_hw !== null) currentMaxLimit = Math.min(currentMaxLimit, limitsData.auto_hw / Math.cos(angleRad));
                if (diff !== 0 && !ignoreXW) currentMaxLimit = Math.min(currentMaxLimit, limitsData.auto_xw / Math.sin(angleRad));
            } else if (diff > 90 && diff < 180) {
                let tailRad = (180 - diff) * Math.PI / 180;
                if (!ignoreXW) currentMaxLimit = Math.min(currentMaxLimit, limitsData.auto_xw / Math.sin(tailRad));
                if (limitsData.auto_tw !== null) currentMaxLimit = Math.min(currentMaxLimit, limitsData.auto_tw / Math.cos(tailRad));
            } else if (diff === 180) {
                if (limitsData.auto_tw !== null) currentMaxLimit = Math.min(currentMaxLimit, limitsData.auto_tw);
            }
        }

        if (currentMaxLimit === Infinity || currentMaxLimit > 99.9) {
            return '-';
        } else {
            // === НОВАЯ ЛОГИКА: ПОЗДНЯЯ КОНВЕРТАЦИЯ В М/С ===
            // currentMaxLimit сейчас содержит точные физические узлы после всей тригонометрии
            let finalLimit;
            let unitLabel;

            if (isMps) {
                // Переводим точные узлы в м/с и отбрасываем дробную часть до целых
                finalLimit = Math.floor(currentMaxLimit * 0.514444);
                unitLabel = 'm/s';
            } else {
                // Выводим узлы, также отбрасывая дробную часть
                finalLimit = Math.floor(currentMaxLimit);
                unitLabel = 'kt';
            }

            return finalLimit.toString() + `<span style="font-size:0.75rem; font-weight:600; margin-left:2px;">${unitLabel}</span>`;
        }
    }

    // Рендерим динамическое количество строк (19 для круглых, 18 для смещенных)
    for (let i = 0; i < rowCount; i++) {
        let lC = startL - (i * 10);
        let rC = startR + (i * 10);

        // Коррекция компаса 1-360
        while (lC <= 0) lC += 360;
        while (lC > 360) lC -= 360;
        while (rC <= 0) rC += 360;
        while (rC > 360) rC -= 360;

        // Высчитываем ТОЧНЫЙ угол ветра относительно полосы
        let diffL = Math.abs(rwCourse - lC);
        if (diffL > 180) diffL = 360 - diffL;

        let diffR = Math.abs(rC - rwCourse);
        if (diffR > 180) diffR = 360 - diffR;

        let limitStrL = '-';
        let limitStrR = '-';

        if (limitsData.base_xw === null) {
            let p = '<span style="color:#ef4444; font-size:0.7rem; font-weight:800;">PROHIB</span>';
            limitStrL = p; limitStrR = p;
        } else {
            limitStrL = getLimitStr(diffL);
            limitStrR = getLimitStr(diffR);
        }

        let lCStr = lC.toString().padStart(3, '0');
        let rCStr = rC.toString().padStart(3, '0');

        let limitColor = isMps ? 'var(--limit-mps)' : 'var(--limit-kt)'; 
        let leftOpacity = (dimSide === 'right') ? '0.2' : '1';
        let rightOpacity = (dimSide === 'left') ? '0.2' : '1';

        // Добавляем логику выделения строк "экватора"
        let rowClass = "t-row";
        if (isRoundCourse) {
            if (i === 8) {
                rowClass += " beam-divider"; // Голубая линия сверху 10-й строки (между 9 и 10)
            } else if (i === 9) {
                rowClass += " beam-row beam-divider"; // Голубой фон 10-й строки и линия под ней (между 10 и 11)
            }
        } else if (i === 8) {
            rowClass += " beam-divider"; // Утолщенная линия под 9-й строкой при 18 строках
        }

        h += `<div class="${rowClass}">
                <div class="course-cell" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: ${leftOpacity}; transition: opacity 0.2s ease;" onclick="clickSide('left')">${lCStr}&deg;</div>
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: ${limitColor}; font-weight: 800; cursor: pointer; touch-action: pan-y; opacity: ${leftOpacity}; transition: opacity 0.2s ease;" onpointerdown="startPressUnit(event)" onpointerup="endPressUnit(event)" onpointerleave="cancelPressUnit()" onpointercancel="cancelPressUnit()" onclick="clickSide('left')" oncontextmenu="event.preventDefault()">${limitStrL}</div>
                <div class="rwy-divider"></div>
                <div class="course-cell" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: ${rightOpacity}; transition: opacity 0.2s ease;" onclick="clickSide('right')">${rCStr}&deg;</div>
                <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: ${limitColor}; font-weight: 800; cursor: pointer; touch-action: pan-y; opacity: ${rightOpacity}; transition: opacity 0.2s ease;" onpointerdown="startPressUnit(event)" onpointerup="endPressUnit(event)" onpointerleave="cancelPressUnit()" onpointercancel="cancelPressUnit()" onclick="clickSide('right')" oncontextmenu="event.preventDefault()">${limitStrR}</div>
              </div>`;
    }
    tableBody.innerHTML = h;
    if (shouldCenter) {
        centerTable();
    } else {
        setTimeout(() => {
            const restoredScrollTop = clampTableScrollTop(tableBody, previousScrollTop);
            if (restoredScrollTop === null) return;
            tableBody.scrollTop = restoredScrollTop;
        }, 0);
    }
} // <--- ЗАКРЫВАЕМ updateTable() ЗДЕСЬ!

// === НОВАЯ ОТДЕЛЬНАЯ ФУНКЦИЯ ЦЕНТРОВКИ ===
function centerTable() {
    setTimeout(() => {
        const tableBody = document.getElementById('tableBody');
        if (!tableBody || tableBody.children.length === 0) return;
        
        let targetTop = 0;
        const isRoundCourse = tableBody.children.length === 19;

        if (isRoundCourse) {
            // 19 строк: центрируем строго по 10-й строке (индекс 9)
            const row90 = tableBody.children[9];
            if (row90) {
                targetTop = (row90.offsetTop - tableBody.offsetTop) + (row90.clientHeight / 2);
            }
        } else {
            // 18 строк: центрируем строго по красной линии-разделителю (между 9 и 10 строкой)
            const rowAbove = tableBody.children[8];
            if (rowAbove) {
                targetTop = (rowAbove.offsetTop - tableBody.offsetTop) + rowAbove.clientHeight;
            }
        }

        const containerCenter = tableBody.clientHeight / 2;
        const centeredScrollTop = clampTableScrollTop(tableBody, targetTop - containerCenter);
        if (centeredScrollTop === null) return;
        tableBody.scrollTop = centeredScrollTop;
        saveTableScrollPosition();
    }, 0);
}
    


    // === ФУНКЦИИ СБРОСА ПРИЛОЖЕНИЯ (Dual Action Refresh) ===
    function softResetApp() {
        if (navigator.vibrate) navigator.vibrate(30); // Короткая легкая вибрация
        
        // Базовые переменные FCOM (Сброс на дефолт)
        currentMappingIndex = 0;
        currentCategory = 'RWYCC';
        currentRwycc5State = '5';
        selectedManValue = rwyMapping[0]['MAN_DEFAULT'];
        isMps = true;
        lastC = "2П<small>80%</small>";

        // UI Сброс (Тему оформления не трогаем, чтобы не слепило ночью)
        document.getElementById('windDirInput').textContent = "243°";
        document.getElementById('acTypeBtn').innerHTML = "<span>A320</span>";
        document.getElementById('crewBtn').innerHTML = `<span style="font-size:1.1rem;font-weight:800">КВС</span>`;
        document.getElementById('narrowContBtn').classList.remove('active');
        
        // Вкладки верхнего ряда
        document.querySelectorAll('.tabs-row.upper .tab-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.trim() === 'RWYCC');
        });

        // Режим LAND/TO
        currentLandBase = 'MANUAL';
        landMods = { 'MANUAL_CAT2': false, 'AUTO_ROLL': false };
        toggleOpMode('courseMinusBtn', { center: false }); // Включает Take off и пересчитывает таблицу
        
        if (typeof updateLandModalUI === 'function') updateLandModalUI({ center: false }); // Сбрасываем блокировки CAT2
        updateLowerTabs({ center: true }); // Обновляет нижние кнопки и таблицу
        
        // Мгновенно сохраняем это чистое состояние в память
        saveAppState();
    }

   


// --- STATE PERSISTENCE LOGIC (ТОЧНАЯ АВИАЦИОННАЯ СИНХРОНИЗАЦИЯ) ---
function saveAppState() {
    // Собираем абсолютно все критические переменные расчетов и UI
    const state = {
        course: document.getElementById('windDirInput').textContent,
        acBtnHTML: document.getElementById('acTypeBtn').innerHTML,
        crewBtnHTML: document.getElementById('crewBtn').innerHTML,
        lastC: typeof lastC !== 'undefined' ? lastC : "2П<small>80%</small>",
        opMode: currentOpMode,
        landBase: currentLandBase,
        landMods: landMods,
        isMps: isMps,
        mappingIndex: currentMappingIndex,
        category: currentCategory,
        manValue: selectedManValue,
        rwycc5: currentRwycc5State,
        isNarrow: document.getElementById('narrowContBtn').classList.contains('active')        
    };
    localStorage.setItem('rwyWind_state', JSON.stringify(state));
}

function loadAppState() {
    const saved = localStorage.getItem('rwyWind_state');
    if (!saved) return false; // Нет сохраненных данных

    try {
        const state = JSON.parse(saved);
        
        // 1. Восстанавливаем курс
        if (state.course) document.getElementById('windDirInput').textContent = state.course;
        
        // 2. Восстанавливаем самолет и экипаж
        if (state.acBtnHTML) document.getElementById('acTypeBtn').innerHTML = state.acBtnHTML;
        if (state.crewBtnHTML) document.getElementById('crewBtn').innerHTML = state.crewBtnHTML;
        if (state.lastC) lastC = state.lastC;
        
        // 3. Восстанавливаем режимы посадки/взлета и единицы измерения
        if (state.opMode) currentOpMode = state.opMode;
        if (state.landBase) currentLandBase = state.landBase;
        if (state.landMods) landMods = state.landMods;
        if (state.isMps !== undefined) isMps = state.isMps;
        
        // 4. Восстанавливаем состояние полосы (RWYCC, ESF, ATIS)
        if (state.mappingIndex !== undefined) currentMappingIndex = state.mappingIndex;
        if (state.category) currentCategory = state.category;
        if (state.manValue) selectedManValue = state.manValue;
        if (state.rwycc5) currentRwycc5State = state.rwycc5;
        
        // 5. Восстанавливаем кнопку Narrow/Contaminated
        if (state.isNarrow) document.getElementById('narrowContBtn').classList.add('active');
        else document.getElementById('narrowContBtn').classList.remove('active');

                
        return true;
    } catch (e) {
        console.error('Ошибка чтения сессии:', e);
        return false;
    }
}

// Сохраняем стейт при любом тапе/клике в приложении с небольшой задержкой (чтобы UI успел обновиться)
['click', 'pointerup'].forEach(evt => {
    document.addEventListener(evt, (e) => {
        // Отслеживаем только клики по кнопкам, строкам таблицы и полю ввода курса
        if (e.target.closest('button') || e.target.closest('.t-row') || e.target.id === 'windDirInput') {
            setTimeout(saveAppState, 150);
        }
    });
});

// --- ЗАПУСК ---
window.addEventListener('load', () => {
    
    // Простая кнопка сброса (без долгого тапа)
    const refBtn = document.getElementById('refreshBtn');
    if (refBtn) {
        refBtn.addEventListener('click', (e) => {
            e.preventDefault();
            softResetApp();
        });
    }
});
</script>
