.calculator {
    background: var(--card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    padding: max(2px, calc(var(--safe-top) + 2px)) 20px max(40px, calc(var(--safe-bottom) + 40px)) 20px;
    border-radius: 0; 
    width: min(100vw, 440px);
    width: min(var(--app-width), 440px);
    max-width: 100%;
    min-width: 0;
    box-shadow: var(--shadow);
    
    /* Делаем калькулятор гибким по вертикали */
    display: flex;
    flex-direction: column;
    height: var(--app-height);
    min-height: var(--app-height);
    max-height: var(--app-height);
    box-sizing: border-box;
    position: relative;
}
.theme-toggle {
    position: absolute;
    bottom: max(20px, calc(var(--safe-bottom) + 15px));  
    
    right: 20px; 
    left: auto;
    margin: 0;
    
    background: none;
    border: none;
    padding: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    color: var(--text); 
    opacity: 1;         
    z-index: 100;
    transition: transform 0.2s ease, color 0.3s ease;
}

/* Сенсорная область (Метод 2) */
.theme-toggle::after {
    content: '';
    position: absolute;
    top: -15px;
    bottom: -15px;
    left: -15px;
    right: -15px;
    pointer-events: auto;
}

/* --- ЦЕНТРАЛЬНАЯ КНОПКА МЕНЮ --- */
.menu-btn {
    position: absolute;
    bottom: max(20px, calc(var(--safe-bottom) + 15px));
    left: 50%;
    transform: translateX(-50%);
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 5px;
    cursor: pointer;
    display: flex; /* Критично: размещает иконку и текст в ряд */
    align-items: center; /* Центрируем иконку и текст по вертикали */
    justify-content: center; /* Центрируем контент внутри кнопки */
    color: var(--text);
    z-index: 100;
    transition: transform 0.2s ease, color 0.3s ease;
}
.menu-btn::after {
    content: '';
    position: absolute;
    top: -15px; bottom: -15px; left: -25px; right: -25px;
}
.menu-btn:active { transform: translateX(-50%) scale(0.9); }

/* ИЗМЕНЕНИЕ: Текст меню справа от иконки */
.menu-text {
    font-size: 0.6rem; /* Маленький, matching wind-calc */
    font-weight: 800; /* Стерильный, matching other buttons */
    letter-spacing: 1px; /* Aero-aesthetic */
    text-transform: uppercase; /* Sterile cockpit */
    margin-left: 6px; /* Жесткий отступ от иконки */
    font-family: inherit; /* Используем основной шрифт */
    display: inline-block; /* Гарантирует отступ */
    opacity: 0.9; /* Чуть бледнее, чтобы не отвлекал */
}

/* --- НАДПИСЬ С ИМЕНЕМ КЭША (ПОД МЕНЮ) --- */
.cache-label {
    position: absolute;
    bottom: max(15px, calc(var(--safe-bottom) + 10px)); /* Опускаем в самый низ экрана */
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.45rem;
    color: var(--dim);
    opacity: 0.4;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    pointer-events: none; /* Жестко отключаем любые нажатия */
    z-index: 50;
    white-space: nowrap; /* Запрет на перенос строк */
}

.theme-toggle:active {
    transform: scale(0.9);

 <script>
    (function () {
        function lockAppViewport() {
            const visualViewport = window.visualViewport;
            const rawWidth = visualViewport ? visualViewport.width : window.innerWidth;
            const viewportWidth = Math.floor(rawWidth || window.innerWidth || 0);
            const appWidth = Math.min(viewportWidth, 440) + 'px';
            const staticHeight = window.innerHeight + 'px';
            const root = document.documentElement;
            const body = document.body;

            root.style.setProperty('--app-height', staticHeight);
            root.style.setProperty('--app-width', appWidth);
            root.style.height = staticHeight;
            body.style.height = staticHeight;

            if (viewportWidth && viewportWidth < 440) {
                root.style.width = viewportWidth + 'px';
                body.style.width = viewportWidth + 'px';
            } else {
                root.style.width = '100%';
                body.style.width = '100%';
            }

            const shell = document.querySelector('.calculator');
            if (shell) {
                shell.style.height = staticHeight;
                shell.style.width = appWidth;
            }
        }

        function relockAfterOrientation() {
            lockAppViewport();
            setTimeout(lockAppViewport, 150);
            setTimeout(lockAppViewport, 350);
            setTimeout(lockAppViewport, 700);
        }

        lockAppViewport();

        window.addEventListener('orientationchange', relockAfterOrientation);
        window.addEventListener('resize', lockAppViewport);

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', lockAppViewport);
        }

        if ('virtualKeyboard' in navigator) {
            navigator.virtualKeyboard.overlaysContent = true;
        }
    })();

    let isNeg = false; 

// --- ПЕРЕМЕННЫЕ КЛАВИАТУРЫ ---
    let activeKp = null;
    let currentKpVal = "";
    let placeholderVal = "";
    let isSequentialFlow = false;

    function openKeypad(id, title) {
    activeKp = document.getElementById(id);
    
    // --- ДОБАВЛЯЕМ ИКОНКИ В ЗАГОЛОВОК ---
    let iconHTML = "";
    if (id === 'elev') {
        iconHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; margin-bottom: -2px;"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>';
    } else if (id === 'fdp') {
        iconHTML = '<img src="fdp.png" class="icon-img" style="height: 12px; width: auto; margin-right: 4px; margin-bottom: 2px;">';
    } else if (id === 'fap') {
        iconHTML = '<img src="fap.png" class="icon-img" style="height: 12px; width: auto; margin-right: 4px; margin-bottom: 2px;">';
    } else if (id === 'temp') {
        // НОВОЕ: Добавляем иконку термометра для OAT
        iconHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"      stroke-linejoin="round" style="margin-right: 4px; margin-bottom: -2px;"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>';
    }
    
    // Вставляем иконку и текст с выравниванием по центру
    document.getElementById('kpTitle').innerHTML = '<span style="display: flex; align-items: center; justify-content: center;">' + iconHTML + title + '</span>';
    // ------------------------------------

    // Сохраняем то, что уже было в поле, как подсказку
    placeholderVal = activeKp.value || ""; 
    currentKpVal = ""; // Набор начинаем с чистого листа
    
    // Логика кастомизации кнопки (точка / плюс-минус / 00)
    const dotBtn = document.getElementById('dotBtn');
    dotBtn.style.visibility = 'visible'; // Сбрасываем невидимость на всякий случай

    if (id === 'temp') {
        // Для температуры — смена знака
        dotBtn.innerText = "+/−";
        dotBtn.onclick = function() { kpPress('+/-'); };
        
    } else if (id === 'fdp' || id === 'fap') {
        // Для FDP и FAP — кнопка двойного нуля
        dotBtn.innerText = "00";
        dotBtn.onclick = function() { kpPress('00'); };
        
    } else if (id === 'elev') {
        // НОВОЕ УСЛОВИЕ ДЛЯ ELEV: кнопка минуса
        dotBtn.innerText = "−"; 
        dotBtn.onclick = function() { kpPress('minus_toggle'); };

    } else if (id === 'minInput') {
        // Для DA/MDA дробные и минусы не нужны, прячем кнопку
        dotBtn.style.visibility = 'hidden'; 
        
    } else {
        // Для всех остальных (Angle) — обычная точка
        dotBtn.innerText = ".";
        dotBtn.onclick = function() { kpPress('.'); };
    }

    // --- НОВАЯ ЛОГИКА: МЕНЯЕМ DONE НА NEXT ДЛЯ ЦЕПОЧКИ ---
    const doneBtn = document.getElementById('doneBtn');
    if (doneBtn) {
        // В режиме цепочки кнопка показывает NEXT для всех этапов ввода
        if (isSequentialFlow && (id === 'elev' || id === 'fdp' || id === 'fap' || id === 'temp')) {
            doneBtn.innerText = "NEXT";
        } else {
            doneBtn.innerText = "DONE";
        }
    }

    updateKpDisplay();
    document.getElementById('keypadModal').classList.add('active');
}

    
    function closeKeypad(e) {
    // Закрываем, если нажали DONE или мимо окна (по темному фону)
    if (e && e !== 'done' && e.target !== e.currentTarget) return;

    // --- ЛОГИКА ЦЕПОЧКИ ВВОДА ---
    if (e === 'done' && isSequentialFlow) {
        let currentId = activeKp ? activeKp.id : null;
        calculate(currentId);
        if (activeKp && activeKp.id === 'elev') {
            openKeypad('fdp', 'FDP');
            return; 
        } else if (activeKp && activeKp.id === 'fdp') {
            openKeypad('fap', 'FAP');
            return; 
        } else if (activeKp && activeKp.id === 'fap') {
            openKeypad('temp', 'TEMPERATURE');
            return; 
        } else if (activeKp && activeKp.id === 'temp') {
            // Завершаем цепочку клавиатуры и открываем список углов
            document.getElementById('keypadModal').classList.remove('active');
            activeKp = null;
            isSequentialFlow = false;
            
            // Имитируем открытие меню Angle
            const angleMenu = document.getElementById('angleMenu');
            if (angleMenu) angleMenu.style.display = 'block';
            return;
        }
    }

    // --- СТАНДАРТНОЕ ЗАКРЫТИЕ (или конец цепочки) ---
    let closedId = activeKp ? activeKp.id : null;
    document.getElementById('keypadModal').classList.remove('active');
    isSequentialFlow = false; // Обязательно сбрасываем флаг
    activeKp = null;
    calculate(closedId);
}

    function kpPress(key) {
    if (key === '+/-') {
        toggleSign();
        return;
    }

    // --- НОВАЯ ЛОГИКА ДЛЯ МИНУСА В ELEVATION ---
    if (key === 'minus_toggle') {
        
        // Если ввод только начался (горит бледная подсказка), 
        // нажатие минуса жестко сбрасывает старое значение и начинает новый ввод!
        if (currentKpVal === "") {
            currentKpVal = "- "; 
        } else {
            // Если пользователь уже ввел какие-то новые цифры, 
            // кнопка работает просто как переключатель знака
            let cleanVal = currentKpVal.replace(/^-\s*/, '');
            if (currentKpVal.startsWith('-')) {
                currentKpVal = cleanVal;
            } else {
                currentKpVal = '- ' + cleanVal;
            }
        }
        
        updateKpDisplay();
        
        if (activeKp) {
            activeKp.value = currentKpVal;
            calculate();
        }
        return; 
    }
    // ---------------------------------------------

    if (key === 'clear') {
        currentKpVal = "";
        if (activeKp) activeKp.value = ""; // ДОБАВЛЕНО: жестко очищаем базовое поле, чтобы не было фантомной подсказки
    } else if (key === 'del') {
        currentKpVal = currentKpVal.slice(0, -1);
    } else {
        if (key === '.' && currentKpVal.includes('.')) return;

        if (activeKp && activeKp.id !== 'temp') {
            if ((key === '0' || key === '00') && currentKpVal === "") return;
        }

        // Формируем новое значение
        let newVal = (currentKpVal === "0" && key !== '.') ? key : currentKpVal + key;

        // ПРОВЕРКА ЛИМИТОВ ТЕМПЕРАТУРЫ
        if (activeKp && activeKp.id === 'temp') {
            let num = parseFloat(newVal);
            if (!isNeg && num > 55) { showLimitWarning(); return; }
            if (isNeg && num > 54) { showLimitWarning(); return; }
        }

        currentKpVal = newVal;
    }
    
    updateKpDisplay();

    if (activeKp) {
        // --- ВОТ ЗДЕСЬ МАГИЯ СИМВОЛОВ ---
        if (activeKp.id === 'angleInput' && currentKpVal !== "") {
            activeKp.value = currentKpVal + "°";
        } else {
            activeKp.value = currentKpVal;
        }

        updateTempColors(); 
    }
}

    function updateKpDisplay() {
    let val = currentKpVal;
    const displayEl = document.getElementById('kpValue');

    // --- 1. УНИКАЛЬНАЯ ЛОГИКА ДЛЯ ТЕМПЕРАТУРЫ ---
    if (activeKp && activeKp.id === 'temp') {
        const sign = isNeg ? "−" : "+";
        const color = isNeg ? '#38bdf8' : '#ef4444'; // Синий для минуса, красный для плюса

        if (val === "") {
            if (activeKp.value !== "") {
                // Режим бледной подсказки (если есть старое значение)
                let cleanVal = activeKp.value.replace(/[+−-]/g, ''); 
                displayEl.textContent = sign + cleanVal;
                // Делаем цвет бледно-серым, точно как у остальных полей!
                displayEl.style.color = 'var(--text)'; 
                displayEl.style.opacity = '0.15';      
            } else {
                // Поле пустое: показываем только знак
                displayEl.textContent = sign;
                displayEl.style.color = color;
                displayEl.style.opacity = '1';
            }
        } else {
            // Режим активного ввода
            displayEl.textContent = sign + val;
            displayEl.style.color = color;
            displayEl.style.opacity = '1';
        }
        return; // Обязательно выходим, чтобы код не пошел дальше
    }

    // --- 2. СТАНДАРТНАЯ ЛОГИКА ДЛЯ ОСТАЛЬНЫХ ПОЛЕЙ (Elev, FDP, FAP) ---
    if (val === "" && activeKp && activeKp.value !== "") {
        displayEl.textContent = activeKp.value; // Берем старое значение
        displayEl.style.color = 'var(--text)';  // Используем стандартный цвет текста
        displayEl.style.opacity = '0.15';       // Делаем его бледным
        return; 
    }
    
    // Если начали вводить (val не пустой)
    displayEl.style.opacity = '1';
    displayEl.style.color = 'var(--accent)';
    
    if (val === "") {
        // Держим высоту блока невидимым пробелом, если текста нет совсем
        displayEl.innerHTML = "&nbsp;"; 
    } else {
        displayEl.textContent = val;
    }
}


function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }


    // --- ФУНКЦИИ ФОРМАТИРОВАНИЯ ЕДИНИЦ ИЗМЕРЕНИЯ ---
    function formatUnit(input, unit) {
        let val = input.value.replace(',', '.').replace(/[^\d.-]/g, ''); 
        if (val !== '') {
            input.value = val + (unit === '°' ? '' : ' ') + unit; 
        }
    }

    function unformatUnit(input) {
        input.value = input.value.replace(',', '.').replace(/[^\d.-]/g, '');
    }

    function getNumVal(id) {
        let raw = document.getElementById(id).value.replace(',', '.').replace(/[^\d.-]/g, '');
        return raw === "" ? NaN : parseFloat(raw);
    }

    // --- ОСНОВНЫЕ ФУНКЦИИ ---
    function restartPulseAnimation(element) {
        element.classList.remove('show');
        void element.offsetWidth;
        element.classList.add('show');
    }

    function scrollToActivePoint(isInstant = false) {
    const container = document.getElementById('tableBody');
    if (!container) return;

    const highlights = container.querySelectorAll('.highlight-fdp,.highlight-fap');
    if (highlights.length === 0) return;

    const targetRow = highlights[highlights.length - 1]; 
    const rowHeight = targetRow.offsetHeight || 45; 
    const containerHeight = container.clientHeight;
    const targetScroll = targetRow.offsetTop - (containerHeight - (4 * rowHeight));

    container.scrollTo({
        top: Math.round(targetScroll),
        // Если передан флаг isInstant, скроллим жестко и моментально
        behavior: isInstant === true ? 'auto' : 'smooth'
    });
}

    function showLimitWarning() {
        document.getElementById('limitModal').classList.add('active');
    }

    function closeLimitModal() {
        document.getElementById('limitModal').classList.remove('active');
        
        if (activeKp && activeKp.id === 'temp') {
            currentKpVal = "";   // Внутренняя переменная пуста
            activeKp.value = ""; // Поле ввода в таблице пусто
            isNeg = false;       // Сброс на плюс по умолчанию
            
            document.getElementById('signBtn').innerText = "+";
            
            updateKpDisplay();   // Теперь покажет пустоту, а не "0"
            updateTempColors();  // Сбросит фон поля в нейтральный
            calculate();         // Пересчитает (OAT будет считаться как 0 или пропуск)
        }
    }

    function calculate(sourceId = null, isInitLoad = false) {
    // 1. Обновляем цвета (плюс/минус) для поля температуры
    updateTempColors();
    
    // 2. Получаем значения из полей ввода
    const h_elev = getNumVal('elev');
    const h_fdp  = getNumVal('fdp');
    const h_fap  = getNumVal('fap');
    const angle  = getNumVal('angleInput');
    const h_min  = getNumVal('minInput'); 
    
    const tempRaw = document.getElementById('temp').value.replace(',', '.').replace(/[^\d.-]/g, '');
    let t_val = (tempRaw === "") ? NaN : parseFloat(tempRaw);
    
    // Элементы интерфейса
    const tableBody = document.getElementById('tableBody');
    const fpaDisp = document.getElementById('fpaCorrValue');
    const minCorrDisp = document.getElementById('minCorrValue'); 
    const minInfoBtn = document.getElementById('minInfoBtn');
    const angleInfoBtn = document.getElementById('angleInfoBtn');

    const fdpValid = !isNaN(h_fdp);
    const fapValid = !isNaN(h_fap);
    const minValid = !isNaN(h_min);

    // --- БЛОК 1: РАСЧЕТ ПОПРАВОК (FPA и MIN CORR) ---
    if (!isNaN(h_elev) && !isNaN(angle) && !isNaN(t_val)) {
        const t_gr = isNeg ? -t_val : t_val;
        const K = (288.15 - (0.00198 * h_elev)) / (t_gr + 273.15);
        
        // 1. Расчет угла (FPA)
        const calculatedFPA = (angle * K).toFixed(1);
        const oldFPA = fpaDisp.innerText; // Читаем то, что было на экране ДО обновления
        fpaDisp.innerText = calculatedFPA + "°";

        // Маяк Angle: если расчетный отличается от заданного
        if (parseFloat(calculatedFPA) !== parseFloat(angle)) {
             // Мерцаем ТОЛЬКО если расчетный угол изменился ИЛИ мы вручную правили само поле Angle
            if (oldFPA !== calculatedFPA + "°" || sourceId === 'angleInput') {
                restartPulseAnimation(angleInfoBtn);
            } else {
                angleInfoBtn.classList.add('show'); // Оставляем гореть без мерцания
            }
        } else {
            angleInfoBtn.classList.remove('show');
        }

        // 2. Расчет Minimum Corrected
        if (minValid && h_min >= h_elev) {
            const height = h_min - h_elev; 
            const corrHeight = height * K; 
            const minCorr = Math.round(h_elev + corrHeight); // Округляем до целого фута
            
            // Запоминаем прошлое вычисленное значение через data-атрибут
            const oldMinCorr = minCorrDisp.getAttribute('data-val'); 
            minCorrDisp.setAttribute('data-val', minCorr); 

            minCorrDisp.innerHTML = minCorr + '<span style="font-size: 0.6em; margin-left: 2px; color: var(--dim);">ft</span>';

            // ЛОГИКА МАЯКА MINIMUM (2 условия):
            // Условие 1: Холодно (t_gr < 15)
            // Условие 2: Есть разница (minCorr не равен введенному h_min)
            if (t_gr < 15 && minCorr !== Math.round(h_min)) {
                // Мерцаем ТОЛЬКО если расчетный минимум реально поменялся ИЛИ мы вручную вводили DA/MDA
                if (oldMinCorr != minCorr || sourceId === 'minInput') {
                    restartPulseAnimation(minInfoBtn);
                } else {
                    minInfoBtn.classList.add('show'); // Оставляем гореть без мерцания
                }
            } else {
                minInfoBtn.classList.remove('show');
            }
        } else {
            // Если данные минимума не валидны
            minCorrDisp.innerText = "---";
            minInfoBtn.classList.remove('show');
        }
        
    } else {
        // Если базовые данные не введены
        fpaDisp.innerText = "---"; 
        minCorrDisp.innerText = "---";
        if (minInfoBtn) minInfoBtn.classList.remove('show');
        if (angleInfoBtn) angleInfoBtn.classList.remove('show');
    }

    // --- БЛОК 2: РАСЧЕТ И ОТРИСОВКА ТАБЛИЦЫ ---
    if (isInitLoad) return; // СЛЕПОК: Если мы загрузили готовую таблицу из кэша, прерываем функцию и не перерисовываем её

    // Если базовых данных нет — выводим заглушку
    if (isNaN(h_elev) || isNaN(angle) || isNaN(t_val) || (!fdpValid && !fapValid)) {
        tableBody.innerHTML = '<div class="t-row" style="justify-content:center; color:var(--dim); font-size:0.75rem">Check Inputs (Elevation,FDP or FAP)...</div>';
        return;
    }

    const t_gr_table = isNeg ? -t_val : t_val;
    const K_table = (288.15 - (0.00198 * h_elev)) / (t_gr_table + 273.15);
    const FT_NM = 6076.1155;
    const angRad = angle * (Math.PI / 180);

    // Функции пересчета
    const getDistFromInd = (h) => Math.max(0, Math.ceil(((h - h_elev) / K_table - 50) / (Math.tan(angRad) * FT_NM) * 10) / 10);
    const getIndFromDist = (d) => Math.round(((d * Math.tan(angRad) * FT_NM + 50) * K_table + h_elev) / 10) * 10;

    const d_fdp = fdpValid ? getDistFromInd(h_fdp) : null;
    const d_fap = fapValid ? getDistFromInd(h_fap) : null;

    let tableHTML = ''; 
    let fdpIns = false, fapIns = false;
    
    // Определяем верхнюю точку таблицы
    let startDist = fdpValid ? d_fdp : d_fap;
    let topMile = Math.floor(startDist + 20);

    // Цикл генерации строк (от дальней мили до 2 NM)
    // Цикл генерации строк (от дальней мили до 2 NM)
for (let d = topMile; d >= 2; d--) {
    // Вставляем строку FDP в нужную позицию
    if (fdpValid && !fdpIns && d <= d_fdp) {
        tableHTML += `
            <div class="t-row highlight-fdp"> <div class="col-nm">${d_fdp.toFixed(1)} nm</div>
                <div class="col-mid"><img src="fdp.png" alt="" class="icon-img">FDP</div>
                <div class="col-ft">${Math.round(h_fdp)} ft</div>
            </div>`;
        fdpIns = true;
    }
    // Вставляем строку FAP в нужную позицию
    if (fapValid && !fapIns && d <= d_fap) {
        tableHTML += `
            <div class="t-row highlight-fap"> <div class="col-nm">${d_fap.toFixed(1)} nm</div>
                <div class="col-mid"><img src="fap.png" alt="" class="icon-img">FAP</div>
                <div class="col-ft">${Math.round(h_fap)} ft</div>
            </div>`;
        fapIns = true;
    }

    // ... остальной код (пропуски миль и обычные мили) без изменений ...
    if ((fdpValid && d === d_fdp) || (fapValid && d === d_fap)) continue;
    if (fdpValid && fapValid && d < d_fdp && d > d_fap) continue;

    tableHTML += `
        <div class="t-row">
            <div class="col-nm">${d} nm</div>
            <div class="col-mid"></div>
            <div class="col-ft">${getIndFromDist(d)} ft</div>
        </div>`;
}
    
    // Рендерим таблицу и скроллим
    tableBody.innerHTML = tableHTML;
    setTimeout(scrollToActivePoint, 50);

    // СОХРАНЯЕМ СТЕЙТ ПРИ ЛЮБОМ ПЕРЕСЧЕТЕ (EFB State Persistence)
    if (typeof saveAppState === 'function') saveAppState();
}

    

    function handleEnter(e) { if (e.key === 'Enter') { e.target.blur(); calculate(); } }
    
    function toggleMenu(e) { 
        if (e) e.stopPropagation(); 
        const m = document.getElementById('angleMenu'); 
        m.style.display = m.style.display === 'block' ? 'none' : 'block'; 
    }
    
    function setAngle(val, e) {
    if (e) e.stopPropagation();
    const inp = document.getElementById('angleInput');
    document.getElementById('angleMenu').style.display = 'none';

    if (val === 'another') { 
        openKeypad('angleInput', 'ANGLE'); 
    } else { 
        // ДОБАВЛЯЕМ ЗНАЧОК ГРАДУСА ТУТ:
        inp.value = val.toFixed(1) + "°"; 
        calculate('angleInput'); 
    }
}

    function updateTempColors() {
        const tempInput = document.getElementById('temp');
        const tempRaw = tempInput.value.replace(',', '.').replace(/[^\d.-]/g, '');
        const t_val = tempRaw === "" ? NaN : parseFloat(tempRaw);
        
        const signBtn = document.getElementById('signBtn');

        // Базовые классы для цвета текста и рамки (+ красный, - синий)
        signBtn.className = (!isNeg) ? 'sign-btn-outer pos' : 'sign-btn-outer neg';

        // Задаем наши цвета в переменные для удобства (насыщенность 0.35)
        const blue = 'rgba(56, 189, 248, 0.35)';
        const red = 'rgba(239, 68, 68, 0.35)';

        if (isNaN(t_val)) {
            // Если пусто
            tempInput.style.background = 'var(--input-bg)';
            signBtn.style.background = ''; 
            signBtn.style.color = ''; 
        } else if (t_val === 0) {
            // МАГИЯ ЕДИНОГО ГРАДИЕНТА
            // Кнопка переливается от синего в начале до красного где-то далеко вправо
            signBtn.style.background = `linear-gradient(90deg, ${blue} 0%, ${red} 400%)`;
            // Поле ввода тянет синий цвет откуда-то слева и переходит в красный в конце
            tempInput.style.background = `linear-gradient(90deg, ${blue} -30%, ${red} 100%)`;
            
            signBtn.style.color = 'var(--dim)'; // Серый плюс/минус
        } else if (!isNeg) {
            // Плюс
            tempInput.style.background = red;
            signBtn.style.background = ''; 
            signBtn.style.color = ''; 
        } else {
            // Минус
            tempInput.style.background = blue;
            signBtn.style.background = ''; 
            signBtn.style.color = ''; 
        }
    }

    function toggleSign() {
        // Проверка: если у нас введено 55 и мы жмем "минус", это будет -55, что вне лимита
        if (!isNeg && currentKpVal === "55") {
            showLimitWarning();
            return;
        }

        isNeg = !isNeg;
        document.getElementById('signBtn').innerText = isNeg ? '−' : '+';
        
        if (activeKp && activeKp.id === 'temp') {
            updateKpDisplay();
        }
        calculate();
    }

    // --- ФУНКЦИЯ СБРОСА ПОЛЕЙ (Кнопка NEW APPR) ---
    function resetFields() {
        // 1. Устанавливаем данные по умолчанию
        document.getElementById('elev').value = "620";
        document.getElementById('minInput').value = "";
        document.getElementById('fdp').value = "2500";
        document.getElementById('fap').value = "2000";
        document.getElementById('angleInput').value = "3.0°"; 
        
        // Температуру НЕ сбрасываем, оставляем прошлое значение как подсказку
        
        // 2. Вызываем пересчет (это также сохранит стейт)
        calculate();

        // 3. Меняем текст на кнопке
        const startText = document.getElementById('startBtnText');
        if (startText) {
            startText.innerText = 'NEW APPR';
            sessionStorage.setItem('apprStarted', 'true');
        }

        // 4. Включаем режим цепочки и открываем первое поле
        isSequentialFlow = true; 
        openKeypad('elev', 'ELEVATION');
    }

    // --- STATE PERSISTENCE LOGIC (ВОССТАНОВЛЕНИЕ СЕССИИ) ---
    function saveAppState() {
        const state = {
            elev: document.getElementById('elev').value,
            angle: document.getElementById('angleInput').value,
            min: document.getElementById('minInput').value,
            fdp: document.getElementById('fdp').value,
            fap: document.getElementById('fap').value,
            temp: document.getElementById('temp').value,
            isNeg: isNeg,
            // СЛЕПОК: Сохраняем всю сгенерированную таблицу
            tableHTML: document.getElementById('tableBody') ? document.getElementById('tableBody').innerHTML : ''
        };
        localStorage.setItem('myPath_state', JSON.stringify(state));
    }

    function loadAppState() {
        const saved = localStorage.getItem('myPath_state');
        if (!saved) return false;
        try {
            const state = JSON.parse(saved);
            if (state.elev) document.getElementById('elev').value = state.elev;
            if (state.angle) document.getElementById('angleInput').value = state.angle;
            if (state.min) document.getElementById('minInput').value = state.min;
            if (state.fdp) document.getElementById('fdp').value = state.fdp;
            if (state.fap) document.getElementById('fap').value = state.fap;
            if (state.temp) document.getElementById('temp').value = state.temp;
            if (state.isNeg !== undefined) {
                isNeg = state.isNeg;
                const signBtn = document.getElementById('signBtn');
                if(signBtn) signBtn.innerText = isNeg ? '−' : '+';
            }
            
            // СЛЕПОК: Восстанавливаем таблицу визуально
            let hasSnapshot = false;
            if (state.tableHTML) {
                document.getElementById('tableBody').innerHTML = state.tableHTML;
                // Принудительно гасим стартовую анимацию строк для слепка
                const rows = document.getElementById('tableBody').querySelectorAll('.t-row');
                rows.forEach(r => r.style.animation = 'none');
                // Вызываем мгновенный скролл без задержек
                setTimeout(() => scrollToActivePoint(true), 0);
                hasSnapshot = true;
            }
            
            return hasSnapshot; // Возвращаем true, только если слепок реально загрузился
        } catch (e) {
            console.error('Ошибка чтения сессии:', e);
            return false;
        }
    }

    
    // --- СТАРТ ПРИ ЗАГРУЗКЕ ---
    window.onload = () => {
        // Читаем, удалось ли загрузить слепок
        const hasSavedState = loadAppState(); 
        
        if (!document.getElementById('elev').value) {
            document.getElementById('elev').value = "620";
            document.getElementById('minInput').value = "821";
            document.getElementById('fdp').value = "2500";
            document.getElementById('fap').value = "2000";
            saveAppState();
        }

        // Передаем статус слепка в расчет, чтобы не сломать мгновенную отрисовку
        calculate(null, hasSavedState);
       
        
        if (sessionStorage.getItem('apprStarted') === 'true') {
            document.getElementById('startBtnText').innerText = 'NEW APPR';
        }

        const startBtn = document.getElementById('startApprBtn');
        if (startBtn) {
            startBtn.addEventListener('click', (e) => {
                e.preventDefault();
                resetFields();
                if (navigator.vibrate) navigator.vibrate(30);
            });
        }

        const fapLabel = document.getElementById('fapLabelBtn');
        let lastTapTime = 0;
        if (fapLabel) {
            fapLabel.addEventListener('click', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 400 && tapLength > 0) {
                    e.preventDefault();
                    fillDefaultApproach();
                }
                lastTapTime = currentTime;
            });
        }
    };

    window.onclick = (e) => { 
        if (!e.target.matches('.arrow-btn') && !e.target.matches('#angleInput')) {
            document.getElementById('angleMenu').style.display = 'none'; 
        }
    }

    function fillDefaultApproach() {
        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
        document.getElementById('elev').value = "620";
        document.getElementById('minInput').value = "821";
        document.getElementById('fdp').value = "2500";
        document.getElementById('fap').value = "2000";
        calculate();
    }
</script>
<script src="./app.js"></script>
</body>
</html>
